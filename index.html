{"id": "AK25W-14", "s": "S04", "q": "What is true about the effectuation in action cycle (Sarasvathy, 2001)?", "o": ["Committed stakeholders can bring new means to the venture.", "The goal entrepreneurs choose to pursue should be ambitious and beyond their comfort zone.", "It starts with setting a specific goal.", "If stakeholders do not show any commitment, entrepreneurs will develop new goals."], "c": 0, "neg": false, "e": "Im Effectuation-Zyklus führen Stakeholder-Commitments zu neuen Mitteln (expanding cycle of resources) und neuen Zielen. Der Zyklus beginnt mit den Mitteln, nicht mit einem Ziel.", "src": "S04 Folie 27", "origin": "Altklausur WS 2025/26, Frage 14", "also": ["WS 2022/23, Frage 9", "SS 2023, Frage 32"]},
{"id": "AK25W-20", "s": "S06", "q": "In her talk, Csilla from Beautechful stressed the value of having a clear co-founders’ agreement from the start. What key function did she highlight?", "o": ["It guarantees that all founders will remain equally involved throughout the venture’s development.", "It prevents any changes to the business model once the venture is incorporated.", "It ensures clarity about equity allocations, which becomes especially crucial when founders differ in the time or effort they invest later.", "It formalizes the legal structure needed to hire employees early."], "c": 2, "neg": false, "e": "Csilla betonte, dass eine Gründervereinbarung Klarheit über die Equity-Verteilung schafft – besonders wichtig, wenn Gründer später unterschiedlich viel Zeit/Aufwand investieren.", "src": "S06 Folie 12 (Partnerschaften/Co-Founder)", "origin": "Altklausur WS 2025/26, Frage 20"},
{"id": "AK26S-13", "s": "S06", "q": "Why did Beautechful pivot from a \"scan and make\" concept to a \"scan and recommend\" system?", "o": ["Legal regulations banned in-store manufacturing devices.", "Customer feedback showed no demand for a make/mixing device.", "They lacked the engineering expertise and manufacturing devices needed to build a device that produces the product itself.", "A competitor already patented the \"scan and make\" concept."], "c": 2, "neg": false, "e": "Beautechful fehlte die Engineering-Expertise und Fertigungstechnik für ein Gerät, das das Produkt selbst herstellt – daher der Pivot zu 'Scan and recommend'.", "src": "S06 Folie 27 (Pivot)", "origin": "Altklausur SS 2026, Frage 13"},
{"id": "AK26S-04", "s": "S06", "q": "In her talk, how did Csilla from Beautechful illustrate her approach to resource mobilization?", "o": ["She waited for industry partners to express interest before initiating conversations, to avoid appearing unprepared.", "She actively contacted unfamiliar industry experts and leveraged these weak-tie connections to gain insights and potential collaborations.", "She focused on formal partnership applications rather than informal outreach, to maintain a structured relationship-building process.", "She relied mainly on her strong ties, approaching only close contacts who were already familiar with her project."], "c": 1, "neg": false, "e": "Csilla kontaktierte aktiv fremde Branchenexperten und nutzte diese schwachen Bindungen für Einblicke und Kooperationen.", "src": "S06 Folie 34–36 (Resource mobilization); S03 Folie 19 (weak ties)", "origin": "Altklausur SS 2026, Frage 4", "also": ["WS 2025/26, Frage 35"]},
{"id": "AK25W-24", "s": "S07", "q": "Which of the following statements about business models is INCORRECT (as discussed in the context of the Business Model Canvas in our lecture)?", "o": ["Business models include the most important activities that a new venture needs to perform.", "The term \"business model\" is commonly used but poorly understood.", "A business model is a tool that is usually too complicated for young startups as they have to define their target group and value proposition.", "The Business Model Canvas Value Proposition provides an explanation why customers would choose the specific product or service in the focus of the model."], "c": 2, "neg": true, "e": "Geschäftsmodelle sind gerade für junge Startups hilfreich, um Zielgruppe und Nutzenversprechen zu klären – sie sind nicht 'zu kompliziert'.", "src": "S07 Folie 8–14", "origin": "Altklausur WS 2025/26, Frage 24"},
{"id": "AK26S-06", "s": "S07", "q": "Which of the following statements about business models is INCORRECT (as discussed in the context of the Business Model Canvas in our lecture)?", "o": ["Business models can demonstrate how components of a company work in conjunction.", "A business model is a tool that is usually too complicated for young startups as they have to define their target group and value proposition.", "Business models include the most important activities that a new venture needs to perform.", "The Business Model Canvas Value Proposition provides an explanation why customers would choose the specific product or service in the focus of the model."], "c": 1, "neg": true, "e": "Geschäftsmodelle sind gerade für junge Startups hilfreich, um Zielgruppe und Nutzenversprechen zu klären – sie sind nicht 'zu kompliziert'.", "src": "S07 Folie 8–14", "origin": "Altklausur SS 2026, Frage 6"},
{"id": "AK24S-30", "s": "S07", "q": "According to the lecture, which of the following statements is NOT a correct application of the business model canvas?", "o": ["The front end concerns customer-related aspects such as customer segmentation and building and maintaining customer relationships.", "The value proposition describes the types of customers who appreciate the product the most.", "The back end relates to aspects needed to run a business such as hiring employees and buying product components.", "Motivations to work with key partners may include reducing risk or optimizing economies of scale."], "c": 1, "neg": true, "e": "Das Nutzenversprechen beschreibt, welchen Wert das Angebot liefert bzw. welche Probleme es löst – nicht, welche Kundentypen es am meisten schätzen (das wären Customer Segments).", "src": "S07 Folie 12–15, 20", "origin": "Altklausur SS 2024, Frage 30"},
{"id": "AK24W-07", "s": "S07", "q": "Which of the following segments of the Business Model Canvas can be considered a “Front End” segment?", "o": ["Revenue Streams.", "Key Partners.", "Cost Structure.", "Key Resources."], "c": 0, "neg": false, "e": "Das 'Front End' des BMC umfasst die kundenbezogenen Bausteine (Kundensegmente, Kanäle, Kundenbeziehungen, Einnahmequellen). Key Partners, Key Resources und Kostenstruktur gehören zum 'Back End'.", "src": "S07 Folie 12–13", "origin": "Altklausur WS 2024/25, Frage 7"},
{"id": "AK23W-11", "s": "S07", "q": "According to the business model canvas as presented in the lecture, what is NOT an example of how a venture can create value for the key customers?", "o": ["Through newness.", "Through risk reduction.", "Through convenience.", "Through partnership."], "c": 3, "neg": true, "e": "Beispiele für Wertschöpfung im Value-Proposition-Baustein sind u. a. Neuheit, Risikoreduktion, Bequemlichkeit – Partnerschaft gehört nicht dazu.", "src": "S07 Folie 14", "origin": "Altklausur WS 2023/24, Frage 11"},
{"id": "AK25W-34", "s": "S07", "q": "What does the LAP Coffee example from the lecture illustrate about value propositions?", "o": ["That low prices always indicate an unsustainable business model.", "That investor-backed ventures cannot offer authentic value propositions.", "That entrepreneurial decisions on the value propositions can trigger public controversy.", "That price cannot be a legitimate value proposition."], "c": 2, "neg": false, "e": "Das LAP-Coffee-Beispiel zeigt, dass Entscheidungen über das Nutzenversprechen (z. B. sehr niedrige Preise) öffentliche Kontroversen auslösen können.", "src": "S07 Folie 14 (Value Proposition)", "origin": "Altklausur WS 2025/26, Frage 34"},
{"id": "AK24W-08", "s": "S07", "q": "The Business Model Canvas can distinguish between different types of customer segments. What does it mean when a startup focuses on segmented markets?", "o": ["The startup focuses on one large customer group.", "The startup focuses on a specific, clearly defined customer segment.", "The startup focuses on different customers groups with different needs and problems.", "The startup focuses on different products in different markets."], "c": 2, "neg": false, "e": "Ein segmentierter Markt bedeutet, dass das Startup verschiedene Kundengruppen mit unterschiedlichen Bedürfnissen und Problemen bedient.", "src": "S07 Folie 15", "origin": "Altklausur WS 2024/25, Frage 8"},
{"id": "AK26S-14", "s": "S07", "q": "According to the lecture, why is identifying customer segments for the Business Model Canvas more than simply selecting a demographic category?", "o": ["Because customer segmentation should consider how different groups perceive and value the offering.", "Because customer segments should match industry-standard profiles to be comparable across markets.", "Because customer segments should mainly be defined geographically.", "Because demographics cannot be used to forecast revenue streams with sufficient precision."], "c": 0, "neg": false, "e": "Kundensegmentierung im BMC soll berücksichtigen, wie verschiedene Gruppen das Angebot wahrnehmen und bewerten – nicht nur demografische Merkmale.", "src": "S07 Folie 15", "origin": "Altklausur SS 2026, Frage 14"},
{"id": "AK25S-04", "s": "S07", "q": "A startup wants to create special chocolate bars and comes up with the value proposition that customers can create their own bars from a set of ingredients (i.e. customized chocolate bars). As an expert in the Business Model Canvas, what piece of advice are you UNLIKELY to give?", "o": ["An online shop would be the most appropriate distribution channel as customers can select from the set of ingredients in the web shop.", "Supermarkets would be the most appropriate distribution channel because customers can compare the new chocolate bar to existing bars.", "A key partner could be a company that produces nuts and spices.", "If the startup wants to sell directly to the end consumer, it will need to include a budget for marketing in the cost structure."], "c": 1, "neg": true, "e": "Bei individuell konfigurierbaren Riegeln passt der Supermarkt als Kanal nicht – dort ist keine Individualisierung möglich. Dieser Rat ist daher unwahrscheinlich.", "src": "S07 Folie 16, 20–21", "origin": "Altklausur SS 2025, Frage 4", "also": ["SS 2023, Frage 21"]},
{"id": "AK25S-34", "s": "S07", "q": "In our example of Coca-Cola’s business model, in which segment would you expect their Displays and Fridges to be?", "o": ["Key Resources.", "Customer Relationships.", "Channels.", "Key Activities."], "c": 1, "neg": false, "e": "Auf der Coca-Cola-BMC-Folie der Vorlesung (S07 Folie 23) steht „Displays and fridges“ im Baustein Customer Relationships (neben „Advertisement to consumers“ und dem Resident Account Developer). Kühlschränke und Displays pflegen die Beziehung zu Händlern und Konsumenten; Kanäle sind dort „Large scale distribution“ und „Manual Distribution Centers“.", "src": "S07 Folie 23 (Coca-Cola-BMC: „Displays and fridges“ unter Customer Relationships)", "origin": "Altklausur SS 2025, Frage 34", "also": ["WS 2024/25, Frage 13"]},
{"id": "AK22W-10", "s": "S07", "q": "Lufthansa implemented the systems to give access to all its passengers to a self check-in service before boarding every flight. According to our lecture, these considerations should be included in the following section of Lufthansa's business model canvas:", "o": ["Customer relationships.", "Key partners.", "Value proposition.", "Key differentiators."], "c": 0, "neg": false, "e": "Ein Self-Check-in ist eine Form der Kundenbeziehung (Self-Service) im Business Model Canvas.", "src": "S07 Folie 17", "origin": "Altklausur WS 2022/23, Frage 10"},
{"id": "AK23S-23", "s": "S07", "q": "Looking at the Business Model Canvas of LinkedIn discussed in the lecture, the LinkedIn Platform is probably LinkedIn's most important…", "o": ["Key Resource.", "Value Proposition.", "Revenue Stream.", "Cost Structure."], "c": 0, "neg": false, "e": "Auf der LinkedIn-BMC-Folie (S07 Folie 25) steht die „LinkedIn Platform“ als einziger Eintrag unter Key Resources – sie ist LinkedIns wichtigste Schlüsselressource.", "src": "S07 Folie 25 (LinkedIn-BMC: „LinkedIn Platform“ unter Key Resources)", "origin": "Altklausur SS 2023, Frage 23"},
{"id": "AK24S-07", "s": "S07", "q": "Looking at the Business Model Canvas of Coca Cola discussed in the lecture, syrup factories and bottling plants and distribution centers are part of Coca Cola's …", "o": ["key partners.", "customer segments.", "key resources.", "key activities."], "c": 2, "neg": false, "e": "Auf der Coca-Cola-BMC-Folie (S07 Folie 23) stehen Syrup Factory sowie Bottling plant and distribution center (neben Secret recipe und Bottles and Crates) unter Key Resources – es sind physische Schlüsselressourcen.", "src": "S07 Folie 23 (Coca-Cola-BMC: Syrup Factory, Bottling plant and distribution center unter Key Resources)", "origin": "Altklausur SS 2024, Frage 7"},
{"id": "AK26S-19", "s": "S07", "q": "According to the lecture, what is true about the Business Model Canvas?", "o": ["The nine building blocks of the Business Model Canvas are independent of each other.", "The value generated from customers is captured in a derivative currency and users pay for this derivative currency.", "The Business Model Canvas describes the functioning of young startups, but does not apply to established organizations.", "The Business Model Canvas Cost Structures can either be cost-driven or value-driven."], "c": 3, "neg": false, "e": "Die Kostenstruktur im BMC kann kostengetrieben oder wertgetrieben sein.", "src": "S07 Folie 21, 24", "origin": "Altklausur SS 2026, Frage 19", "also": ["WS 2022/23, Frage 18", "WS 2023/24, Frage 10", "WS 2025/26, Frage 19"]},
{"id": "AK26S-20", "s": "S07", "q": "What is NOT true about economies of scale?", "o": ["The first item produced is relatively more expensive than the next produced items.", "You are better able to offer a lower price for your service, the more customers you have.", "You build on activities that you do anyway and apply it to other areas.", "The more products you produce, the cheaper it gets per item."], "c": 2, "neg": true, "e": "Aktivitäten, die man ohnehin durchführt, auf andere Bereiche zu übertragen, beschreibt Verbundeffekte (Economies of Scope), nicht Skaleneffekte.", "src": "S07 Folie 21", "origin": "Altklausur SS 2026, Frage 20"},
{"id": "AK23W-31", "s": "S07", "q": "Which statement refers to a company having a multi-sided business model?", "o": ["A company serving numerous customer segments in different markets.", "A company generating revenues from customers who are not the primary user-base.", "A company leveraging numerous different partnerships to optimize their front and back end operations.", "A company focusing on profitability and sustainability aspects."], "c": 1, "neg": false, "e": "Ein mehrseitiges Geschäftsmodell liegt vor, wenn ein Unternehmen Erlöse von Kunden erzielt, die nicht die primäre Nutzerbasis sind.", "src": "S07 Folie 24", "origin": "Altklausur WS 2023/24, Frage 31"},
{"id": "AK26S-25", "s": "S07", "q": "What is a main derivative currency captured from users in a multi-sided business model like Instagram?", "o": ["US-Dollar.", "Data.", "User-generated content.", "Equity."], "c": 1, "neg": false, "e": "In mehrseitigen Modellen wird der Wert bei Nutzern in einer Derivatwährung erfasst; bei Instagram sind das v. a. Nutzerdaten (und Aufmerksamkeit), die an Werbekunden monetarisiert werden.", "src": "S07 Folie 24", "origin": "Altklausur SS 2026, Frage 25", "also": ["SS 2025, Frage 1"]},
{"id": "SK-06", "s": "S07", "q": "When do we speak about a multi-sided business model?", "o": ["When there is more than one customer segment.", "When a company generates revenues from customers who are not the primary user-base.", "When a company leverages several distribution channels.", "When the users of a product / service are also involved in the creation of the product / service."], "c": 1, "neg": false, "e": "Ein Multi-sided Business Model liegt vor, wenn Nutzer nicht die zahlenden Kunden sind: Wert wird bei den Nutzern in einer abgeleiteten Währung (Aufmerksamkeit, Daten, Content) erfasst und von Kunden auf einem Sekundärmarkt monetarisiert. Mehrere Kundensegmente, mehrere Kanäle oder Co-Creation allein machen ein Geschäftsmodell nicht multi-sided.", "src": "S07 Folie 24 (Multi-sided business model)", "origin": "Beispielfrage Skript S10 Folie 4", "also": ["WS 2022/23, Frage 12", "SS 2023, Frage 3", "SS 2024, Frage 2", "WS 2024/25, Frage 3", "SS 2025, Frage 27"]},
{"id": "AK23S-01", "s": "S07", "q": "The Sustainable Business Model Canvas is an extension of the traditional Business Model Canvas. What is true about the Sustainable Business Model Canvas?", "o": ["The Sustainable Business Model Canvas additionally covers Values and Vision.", "The Sustainable Business Model Canvas additionally covers Cost / Benefit Balance.", "The Value Proposition building block of the Sustainable Business Model Canvas only focuses on Sustainable Development Goals.", "The Costs building block of the Sustainable Business Model Canvas is subdivided into Financial Costs, Environmental Costs, and Sustainability Costs."], "c": 1, "neg": false, "e": "Das Sustainable Business Model Canvas ergänzt das klassische BMC u. a. um eine Kosten-Nutzen-Bilanz (Cost/Benefit Balance), die ökologische und soziale Wirkungen einbezieht.", "src": "S07 Folie 26 (Sustainable BMC, EPFL)", "origin": "Altklausur SS 2023, Frage 1"},
{"id": "AK22W-11", "s": "S07", "q": "Looking at the Business Model Canvas of Flixbus, the bus companies are probably Flixbus's most important…", "o": ["Key Partners.", "Competitors.", "Revenue Stream.", "Customers."], "c": 0, "neg": false, "e": "Flixbus besitzt die Busse nicht selbst, sondern arbeitet mit Busunternehmen als Subunternehmern – diese sind die wichtigsten Key Partners.", "src": "S07 Folie 28", "origin": "Altklausur WS 2022/23, Frage 11"},
{"id": "AK23W-15", "s": "S07", "q": "Looking at the Business Model Canvas of Flixbus, the bus companies are Flixbus's most important…", "o": ["Key Partners.", "Channels.", "Revenue Streams.", "Value proposition."], "c": 0, "neg": false, "e": "Flixbus arbeitet mit regionalen Busunternehmen als Subunternehmer – diese sind Key Partners.", "src": "S07 Folie 28", "origin": "Altklausur WS 2023/24, Frage 15"},
{"id": "AK25S-24", "s": "S07", "q": "During the lecture, we examined the case study of Flixbus. Which of the following statements about the company is NOT true?", "o": ["Flixbus does not own \"its\" buses.", "Flixbus provides customer support through a hotline and social media.", "Flixbus has acquired other large bus companies internationally.", "Flixbus primarily targets older customers."], "c": 3, "neg": true, "e": "Flixbus richtet sich vor allem an jüngere, preisbewusste Kunden (z. B. Studierende) – nicht an ältere Kunden.", "src": "S07 Folie 28", "origin": "Altklausur SS 2025, Frage 24", "also": ["WS 2024/25, Frage 30"]},
{"id": "AK25W-01", "s": "S08", "q": "What is typically true about cash flow in the early stages of a startup, as described by our guest lecturers Inga and Phillip from UnternehmerTUM Funding for Innovators?", "o": ["It is usually negative, because startups require more money than they generate in the beginning.", "It becomes positive as soon as the product is launched on the market.", "It is usually positive, meaning startups earn more than they spend.", "It remains neutral until the first financing round is completed, then the cashflow usually decreases."], "c": 0, "neg": false, "e": "In frühen Phasen ist der Cashflow von Startups meist negativ, weil sie mehr Geld benötigen, als sie einnehmen (Burn Rate).", "src": "S08 Folie 4 (Finanzierungsphasen, Grafik)", "origin": "Altklausur WS 2025/26, Frage 1"},
{"id": "AK25W-10", "s": "S08", "q": "Which statement about the investment focus of UnternehmerTUM Funding for Innovators is true, according to the guest lecture given by Inga and Phillip?", "o": ["They focus on very early-stage startups and often invest even before the first formal funding round.", "They preferably invest in B2C startups.", "They focus on later-stage ventures and typically join only once a startup is in financing rounds beyond Series A.", "They prioritize companies with several years of recurring revenue to minimize early-stage risk."], "c": 0, "neg": false, "e": "UnternehmerTUM Funding for Innovators investiert sehr früh in technologiebasierte Teams (Grants, Pre-Seed), oft schon vor der ersten formalen Finanzierungsrunde – mit B2B-Fokus.", "src": "S08 Folie 11–14 (Pre-Seed, Fokus B2B/Deep Tech)", "origin": "Altklausur WS 2025/26, Frage 10"},
{"id": "AK26S-11", "s": "S08", "q": "According to the guest lecture by Inga and Phillip from UnternehmerTUM Funding for Innovators, which statement about convertible loans is correct?", "o": ["They provide a loan at time X that later converts into shares based on the company’s valuation at time X+1 (usually the next equity round).", "They can only be issued during formal funding rounds such as Pre-Seed or Series A.", "They usually benefit the investor more than the entrepreneur.", "All of the options provided are correct."], "c": 0, "neg": false, "e": "Ein Wandeldarlehen (Convertible Loan) ist ein Darlehen zum Zeitpunkt X, das später – meist in der nächsten Finanzierungsrunde – zur dann gültigen Bewertung in Anteile umgewandelt wird.", "src": "S08 Folie 14 (Convertible loans)", "origin": "Altklausur SS 2026, Frage 11", "also": ["WS 2025/26, Frage 30"]},
{"id": "AK26S-10", "s": "S08", "q": "Which \"myth\" about startup funding did our guest lecturers Inga and Phillip from UnternehmerTUM Funding for Innovators explicitly debunk?", "o": ["That you need to raise a lot of money before starting a startup.", "That due diligence takes over a year to complete.", "That venture capital is only available to B2C companies.", "That convertible loans are riskier than equity investments."], "c": 0, "neg": false, "e": "Inga und Phillip widerlegten den Mythos, man müsse vor der Gründung viel Geld einsammeln.", "origin": "Altklausur SS 2026, Frage 10", "src": "S08 (Gastvortrag; „Mythen“ nicht auf den Folien 2026/27)"},
{"id": "AK23W-07", "s": "S10", "q": "Which statement most accurately describes the concept of resource mobilization?", "o": ["It is about establishing which resources one personally owns.", "It focuses on identifying resource holders and approaching them.", "It entails searching for, accessing, and transferring resources.", "It is an established linear process that starts with the resource environment."], "c": 2, "neg": false, "e": "Ressourcenmobilisierung umfasst das Suchen (Search), den Zugang (Access) und den Transfer (Transfer) von Ressourcen (Clough et al.).", "src": "S10 Folie 6–8", "origin": "Altklausur WS 2023/24, Frage 7"},
{"id": "AK25S-14", "s": "S10", "q": "According to the lecture, what is the key characteristic of a pivot in entrepreneurship?", "o": ["An incremental adjustment in operation strategy.", "A major strategic change through reallocation of resources.", "Diversifying into multiple unrelated industries.", "Focusing on minimizing costs while maintaining operations."], "c": 1, "neg": false, "e": "Ein Pivot ist eine größere strategische Richtungsänderung durch Umverteilung oder Restrukturierung von Ressourcen (Kirtley & O'Mahony).", "src": "S10 Folie 6–8 (Pivoting)", "origin": "Altklausur SS 2025, Frage 14"},
{"id": "AK24W-06", "s": "S10", "q": "Knowing one's BATNA is relevant for entrepreneurs in the context of…", "o": ["Opportunity Identification.", "Negotiations.", "Personality Traits.", "Creativity Stimulation."], "c": 1, "neg": false, "e": "BATNA (Best Alternative To a Negotiated Agreement) ist ein Konzept der Verhandlungsvorbereitung.", "src": "S10 Folie 16–17", "origin": "Altklausur WS 2024/25, Frage 6", "also": ["WS 2022/23, Frage 8", "SS 2024, Frage 17"]},
{"id": "AK24W-21", "s": "S10", "q": "What does BATNA stand for?", "o": ["Best attempt to negotiate an agreement.", "Best alternative to a negotiated agreement.", "Balanced approach to negotiated agreements.", "Best agreement terms for negotiated actions."], "c": 1, "neg": false, "e": "BATNA steht für Best Alternative To a Negotiated Agreement.", "src": "S10 Folie 16", "origin": "Altklausur WS 2024/25, Frage 21"},
{"id": "AK25W-15", "s": "S10", "q": "According to the lecture, why is understanding both parties’ BATNA essential for entrepreneurial negotiation?", "o": ["Because BATNAs guarantee that both sides will reach an agreement if they are sufficiently similar.", "Because knowing BATNAs helps predict each side’s flexibility and identify when walking away may be preferable.", "Because BATNAs determine whether a negotiation should follow the central or peripheral route of persuasion.", "Because BATNAs allow entrepreneurs to calculate the monetary value of the deal before entering discussions."], "c": 1, "neg": false, "e": "Die eigene und die gegnerische BATNA zu kennen zeigt, wie flexibel jede Seite ist und wann ein Abbruch der Verhandlung besser ist.", "src": "S10 Folie 16–17", "origin": "Altklausur WS 2025/26, Frage 15"},
{"id": "AK24W-22", "s": "S10", "q": "In our lecture, we discussed different bargaining principles. Which of the following techniques is associated with the principle of reciprocity?", "o": ["“foot-in-the-door”.", "“hold-the-line”.", "“door-in-the-face”.", "“low-balling”."], "c": 2, "neg": false, "e": "Reziprozität umfasst die Techniken Door-in-the-face und That's-not-all-folks; Foot-in-the-door und Low-balling beruhen auf Commitment & Konsistenz.", "src": "S10 Folie 21–26", "origin": "Altklausur WS 2024/25, Frage 22"},
{"id": "AK23S-11", "s": "S10", "q": "“Foot-in-the-door\" is an important negotiation technique for entrepreneurs and corresponds to:", "o": ["Escalating pattern of requests.", "Inducements that are withdrawn after a commitment is made.", "Making an extreme request and following it up with a more reasonable one.", "Increasing the offer or reducing the costs."], "c": 0, "neg": false, "e": "Foot-in-the-door ist ein eskalierendes Anfragemuster: erst eine kleine Bitte, dann eine größere (Prinzip Commitment & Konsistenz).", "src": "S10 Folie 24–25", "origin": "Altklausur SS 2023, Frage 11", "also": ["WS 2022/23, Frage 6"]},
{"id": "AK23W-02", "s": "S10", "q": "As an entrepreneur, you want more people to buy your CO2-saving product. Therefore, visitors of your website are asked whether they care about nature, first. Only after answering that question they can enter the web-store. This technique is best labeled as:", "o": ["Door-in-the-face.", "That’s-not-all-folks.", "Foot-in-the-door.", "Low-balling."], "c": 2, "neg": false, "e": "Erst eine kleine, leicht zu bejahende Frage ('Liegt Ihnen die Natur am Herzen?'), dann die größere Bitte (Kauf) – das ist Foot-in-the-door (Commitment & Konsistenz).", "src": "S10 Folie 24–25", "origin": "Altklausur WS 2023/24, Frage 2"},
{"id": "AK25S-22", "s": "S10", "q": "As an entrepreneur, you want more people to subscribe to the online fitness plan you are offering on your website. Therefore, visitors are first asked whether they want to get fit and healthy. Only after answering that question positively can they proceed to the subscription plans. This technique is best labeled as:", "o": ["Door-in-the-face.", "That’s-not-all-folks.", "Foot-in-the-door.", "Low-balling."], "c": 2, "neg": false, "e": "Erst eine kleine Zustimmung ('Wollen Sie fit werden?'), dann die größere Bitte (Abo) – Foot-in-the-door.", "src": "S10 Folie 24–25", "origin": "Altklausur SS 2025, Frage 22"},
{"id": "AK25W-07", "s": "S10", "q": "Our guest lecturer Csilla from Beautechful shared that her team collected several LOIs (letters of intent) from potential partners and customers to demonstrate early traction when approaching investors. From the perspective of bargaining and persuasion techniques discussed in the lecture, what does this approach most closely represent?", "o": ["Using the “door-in-the-face” technique because the LOI represents a large request followed by a smaller one.", "Using reciprocity because early partners receive a benefit upfront that they later feel obligated to return.", "Applying the \"foot-in-the-door\" technique because obtaining a small, low-commitment agreement increases the likelihood of securing larger commitments later on.", "Applying “low-balling” because conditions change after the initial commitment is made."], "c": 2, "neg": false, "e": "LOIs sind kleine, unverbindliche Zusagen, die spätere größere Commitments wahrscheinlicher machen – das entspricht Foot-in-the-door (Commitment & Konsistenz).", "src": "S10 Folie 24–25 (Foot-in-the-door)", "origin": "Altklausur WS 2025/26, Frage 7"},
{"id": "AK25W-21", "s": "S10", "q": "Assume that as an entrepreneur you have accepted a seemingly great offer by an investor. However, when it comes to signing the contract, the investor asks for a higher percentage of equity on top of the initial amount. Which bargaining tactic has the investor used?", "o": ["Door-in-the-face.", "Foot-in-the-door.", "That’s-not-all-folks.", "Low-balling."], "c": 3, "neg": false, "e": "Ein Angebot wird angenommen und danach verschlechtert (mehr Equity verlangt) – das ist Low-balling: Anreize werden nach der Zusage zurückgezogen.", "src": "S10 Folie 26", "origin": "Altklausur WS 2025/26, Frage 21", "also": ["SS 2024, Frage 10"]},
{"id": "AK26S-12", "s": "S10", "q": "To secure a commitment from a supplier, an entrepreneur first agrees verbally to a very attractive pricing structure. After the supplier accepts, the entrepreneur explains that some conditions will need to be adjusted upward due to “unexpected constraints,” but assumes the supplier will still go ahead. Which negotiation technique is being used?", "o": ["Central-route persuasion, because the entrepreneur relies on logical arguments to justify the price change.", "Low-balling, because the initial attractive offer is changed after commitment has already been secured.", "Door-in-the-face, because a large request is followed by a smaller one.", "That’s-not-all, because the entrepreneur modifies the offer after presenting it, assuming the added information will make the partner more willing to proceed."], "c": 1, "neg": false, "e": "Erst attraktives Angebot, nach der Zusage werden die Bedingungen verschlechtert – das ist Low-balling.", "src": "S10 Folie 26", "origin": "Altklausur SS 2026, Frage 12"},
{"id": "AK24S-11", "s": "S10", "q": "In the context of entrepreneurial resource acquisition, what does the definition by Stevenson and Jarillo (1990) emphasize?", "o": ["Entrepreneurship involves securing ample resources before pursuing opportunities.", "Entrepreneurship involves individuals pursuing opportunities, irrespective of their current resource constraints.", "Opportunities are pursued only when individuals have complete control over all necessary resources.", "Entrepreneurship is a process that prioritizes the current possession of resources over the pursuit of opportunities."], "c": 1, "neg": false, "e": "Stevenson & Jarillo (1990) definieren Entrepreneurship als Verfolgen von Gelegenheiten unabhängig von den aktuell kontrollierten Ressourcen.", "src": "S10 Folie 28 (nur Literaturangabe Stevenson & Jarillo, 1990)", "origin": "Altklausur SS 2024, Frage 11"},
{"id": "AK23S-05", "s": "S10", "q": "During a pitching event, an aspiring entrepreneur shows a highly emotional video including pictures and music instead of facts. The video ends with the claim that the venture will be the ideal solution for one of the \"modern world's biggest issues\". This is an example of:", "o": ["The central route of persuasion.", "The peripheral route of persuasion.", "The emotional route of persuasion.", "The commercial route of persuasion."], "c": 1, "neg": false, "e": "Emotionales Video, Bilder und Musik statt Fakten sind periphere Cues – das ist die periphere Route der Überzeugung.", "origin": "Altklausur SS 2023, Frage 5", "src": "S10 Folie 9, 20 (Persuasion); zentrale/periphere Route nicht explizit auf den Folien 2026/27"},
{"id": "AK23S-10", "s": "S10", "q": "In order for an entrepreneur to get access to resources provided by business stakeholders, she has to communicate a strong vision. According to our lecture, what is true about this vision?", "o": ["It is a projected mental image of the products, services, and organization a leader aspires to.", "It depicts an ideal and unique image of the future.", "It is a positive, general, and emotionally laden idea related to strong values.", "All of the above."], "c": 3, "neg": false, "e": "Eine Vision ist ein projiziertes mentales Bild der angestrebten Produkte/Organisation, ein ideales und einzigartiges Zukunftsbild und eine positive, emotional aufgeladene Idee mit starken Werten – alle Aussagen stimmen.", "origin": "Altklausur SS 2023, Frage 10", "src": "S10 (Thema nicht auf den Folien 2026/27 – früherer Vorlesungsinhalt)"},
{"id": "AK23S-35", "s": "S10", "q": "What is a key assumption of Barney’s resource-based view of the firm?", "o": ["Some resources are inelastic in supply or costly to copy.", "A firm's resources must be imperfectly imitable.", "Resources provide a firm with a sustained competitive advantage.", "All of the above."], "c": 0, "neg": false, "e": "Barneys Resource-based View nimmt an, dass Ressourcen heterogen verteilt und immobil sind – manche Ressourcen sind also im Angebot unelastisch oder teuer zu kopieren.", "origin": "Altklausur SS 2023, Frage 35", "also": ["WS 2022/23, Frage 32"], "src": "S10 (Thema nicht auf den Folien 2026/27 – früherer Vorlesungsinhalt)"},
{"id": "AK23W-25", "s": "S10", "q": "Our guest, Johannes Kurtz from Excellion, spoke about ways how the team of Excellion tried to convince their stakeholders. He mentioned that they could not rely on emotions, but had to rely on numbers. If you interpret this statement based on the idea of two routes of persuasion that we discussed in the lecture, which statement is correct?", "o": ["Their stakeholders tend to have a low motivation to process information on their products.", "Their stakeholders tend to have a high motivation to process information on their products.", "Their stakeholders tend to have positive emotions about their products.", "Their stakeholders tend to have negative emotions about their products."], "c": 1, "neg": false, "e": "Wenn Stakeholder nur mit Zahlen überzeugt werden können, verarbeiten sie Informationen systematisch – das setzt eine hohe Motivation zur Informationsverarbeitung voraus (zentrale Route).", "origin": "Altklausur WS 2023/24, Frage 25", "src": "S10 Folie 9, 20 (Persuasion); zentrale/periphere Route nicht explizit auf den Folien 2026/27"},
{"id": "AK25S-13", "s": "S10", "q": "In the persuasion process, what distinguishes the central route of persuasion from the peripheral route?", "o": ["Use of emotional appeals and vivid storytelling.", "Reliance on the communicator's enthusiasm and confidence.", "Decision-making influenced by informal relationships and repeated interactions.", "Judgement based on systematic assessment of central cues like argument quality."], "c": 3, "neg": false, "e": "Bei der zentralen Route werden Entscheidungen auf Basis systematischer Bewertung zentraler Hinweise wie der Argumentqualität getroffen; Emotionen, Begeisterung und Beziehungen sind periphere Cues.", "origin": "Altklausur SS 2025, Frage 13", "src": "S10 Folie 9, 20 (Persuasion); zentrale/periphere Route nicht explizit auf den Folien 2026/27"},
{"id": "AK25W-16", "s": "S10", "q": "During a discussion with a potential supplier, a well-prepared entrepreneur introduces himself as an alumnus from one of Italy’s most prestigious universities. He then goes on to provide a series of logical and strongly built arguments that clarify why forming an alliance with his venture would bring feasible and extensive benefits for the supplier. This is an example of:", "o": ["The emotional route of persuasion.", "The peripheral route of persuasion.", "The central route of persuasion.", "The commercial route of persuasion."], "c": 2, "neg": false, "e": "Logische, stark begründete Argumente zu Nutzen und Machbarkeit sprechen die systematische Verarbeitung an – das ist die zentrale Route der Überzeugung (Elaboration-Likelihood-Modell). Die Erwähnung der Elite-Uni ist nur ein Nebenhinweis; im Kern dominiert die Argumentqualität.", "origin": "Altklausur WS 2025/26, Frage 16", "also": ["WS 2022/23, Frage 2"], "src": "S10 Folie 9, 20 (Persuasion); zentrale/periphere Route nicht explizit auf den Folien 2026/27"},
{"id": "AK26S-23", "s": "S10", "q": "If entrepreneurs persuade their audience by showing confidence and enthusiasm for their idea and use, for instance, personal stories as a way of communicating, they apply:", "o": ["Indirect route of persuasion.", "Peripheral route of persuasion.", "Direct route of persuasion.", "Proximal route of persuasion."], "c": 1, "neg": false, "e": "Zuversicht, Begeisterung und persönliche Geschichten statt Argumentqualität sind periphere Cues – das ist die periphere Route der Überzeugung.", "origin": "Altklausur SS 2026, Frage 23", "also": ["WS 2024/25, Frage 12"], "src": "S10 Folie 9, 20 (Persuasion); zentrale/periphere Route nicht explizit auf den Folien 2026/27"},
{"id": "AK22W-04", "s": "S11", "q": "Our guest speaker Dr. Gesa Biermann (co-founder of pina.earth) talked about how they handle stock option plans for employees. In accordance with our lecture, she mentioned the \"financial cliff\" in a vesting scheme, which has the following advantage:", "o": ["It motivates employees to improve their performance.", "It protects young ventures from early exits of team members and employees.", "It functions as a salary cap for early employees.", "None of the above."], "c": 1, "neg": false, "e": "Der Cliff in einem Vesting-Schema bedeutet, dass vor Ablauf einer Mindestfrist (z. B. 1 Jahr) keine Anteile erdient werden. Das schützt junge Ventures davor, dass Teammitglieder/Mitarbeitende früh mit Anteilen ausscheiden.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2022/23, Frage 4"},
{"id": "AK22W-15", "s": "S11", "q": "Three entrepreneurs have just formed an entrepreneurial team although they barely know each other. Which decision should they make regarding the equity split of the new venture in order to secure a harmonious business development protected against any eventualities?", "o": ["They should split their equity to equal parts.", "They should decide on a dynamic equity split.", "They should decide on their equity shares as soon as possible.", "They should not mention the equity distribution because it will lead to conflicts."], "c": 1, "neg": false, "e": "Bei Teams, die sich kaum kennen, ist ein dynamischer Equity-Split sinnvoll: Anteile werden an tatsächliche Beiträge angepasst und schützen so vor Eventualitäten.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2022/23, Frage 15"},
{"id": "AK22W-24", "s": "S11", "q": "The two founders of \"Re-deko\" (a startup dedicated to redesign and change the decoration of apartments and houses to create nicer living spaces) disagree if they should invest more time in acquiring some more clients for the current offering or if they should first expand their offerings before reaching out to more potential clients. This is an example of:", "o": ["Relationship conflict.", "Task conflict.", "Design conflict.", "None of the above."], "c": 1, "neg": false, "e": "Uneinigkeit über inhaltliche Aufgaben bzw. Strategie (Kundenakquise vs. Angebotserweiterung) ist ein Aufgabenkonflikt (task conflict).", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2022/23, Frage 24"},
{"id": "AK22W-31", "s": "S11", "q": "In entrepreneurial teams, conflicts may arise due to \"naive realism\". This bias refers to individuals' tendency to…", "o": ["… attribute other's failures and mistakes to external circumstances.", "… believe that their own perception of a situation is an accurate depiction of reality.", "… believe that the majority of people would share their own opinion about another person.", "… attribute their own failures and mistakes to external circumstances."], "c": 1, "neg": false, "e": "Naiver Realismus ist die Tendenz zu glauben, die eigene Wahrnehmung einer Situation sei ein akkurates Abbild der Realität – andere Sichtweisen gelten dann als verzerrt.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2022/23, Frage 31"},
{"id": "AK23S-14", "s": "S11", "q": "Task conflict in entrepreneurial teams is NOT characterized by…", "o": ["disagreements about differences in viewpoints and opinions.", "interpersonal incompatibilities.", "better decision quality.", "increase in venture performance."], "c": 1, "neg": true, "e": "Aufgabenkonflikte sind Meinungsverschiedenheiten über Sichtweisen und Ideen und können Entscheidungsqualität und Performance verbessern. Zwischenmenschliche Unverträglichkeiten kennzeichnen dagegen Beziehungskonflikte.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2023, Frage 14"},
{"id": "AK23S-15", "s": "S11", "q": "What are the benefits for entrepreneurial teams that have formed on the basis of strong ties?", "o": ["They avoid one type of uncertainty, namely relational uncertainty.", "They are more likely to reflect about old and new roles.", "They enjoy more flexibility in search for potential partners.", "They tend to speak early about potential changes in their team composition."], "c": 0, "neg": false, "e": "Teams aus starken Bindungen kennen sich bereits und vermeiden daher relationale Unsicherheit (Wie verlässlich/vertrauenswürdig ist der andere?).", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2023, Frage 15"},
{"id": "AK23W-04", "s": "S11", "q": "Entrepreneurial teams often experience task conflicts. What is true about task conflicts?", "o": ["They reduce trust, cooperation, and venture performance.", "They increase the exchange of ideas, decision quality, and venture performance.", "They arise from interpersonal incompatibilities.", "They are more likely in homogeneous teams."], "c": 1, "neg": false, "e": "Aufgabenkonflikte fördern den Ideenaustausch und können Entscheidungsqualität und Venture-Performance steigern.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2023/24, Frage 4"},
{"id": "AK23W-06", "s": "S11", "q": "According to Klotz et al.'s (2014) Input-Mediator-Outcome framework of entrepreneurial teams, the team members' attitudes, that is, how do they think about the team, are considered to be a part of:", "o": ["Team processes.", "Team interactions.", "Team emergent states.", "Inputs."], "c": 2, "neg": false, "e": "Einstellungen der Mitglieder zum Team gelten im IMO-Modell (Klotz et al., 2014) als emergente Zustände (team emergent states).", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2023/24, Frage 6"},
{"id": "AK24S-03", "s": "S11", "q": "What is NOT one of the defining characteristics of an entrepreneurial team?", "o": ["The team members hold equity ownership.", "The team members focus on a novel product.", "The team members play a key role in strategic decisions.", "The team members take an active part in the development of the business."], "c": 1, "neg": true, "e": "Gründungsteams sind gekennzeichnet durch Anteilsbesitz, Rolle bei strategischen Entscheidungen und aktive Mitwirkung. Der Fokus auf ein neuartiges Produkt ist kein definierendes Merkmal.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2024, Frage 3", "also": ["WS 2023/24, Frage 14"]},
{"id": "AK24S-06", "s": "S11", "q": "According to Klotz et al.'s (2014) Input-Mediator-Outcome framework of entrepreneurial teams, the team members' team-related attitudes (for example, how do they think about the team) is considered to be part of:", "o": ["Team processes.", "Action processes.", "Emergent states.", "Inputs."], "c": 2, "neg": false, "e": "Im Input-Mediator-Outcome-Modell (Klotz et al., 2014) sind Einstellungen der Mitglieder zum Team (z. B. Kohäsion, Vertrauen) emergente Zustände (Mediatoren).", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2024, Frage 6", "also": ["WS 2022/23, Frage 14", "SS 2023, Frage 8"]},
{"id": "AK24W-17", "s": "S11", "q": "Two sisters have just formed an entrepreneurial team. According to the lecture, what challenges are they LESS likely to face in comparison to a team consisting of mere acquaintances?", "o": ["A lack of understanding of the other's values.", "A lack of reflection about old and new roles.", "The challenge to include others, such as future team members.", "They need to learn how to have fights."], "c": 0, "neg": true, "e": "Schwestern kennen sich sehr gut, daher ist fehlendes Verständnis für die Werte der anderen unwahrscheinlicher als bei Bekannten. Rollenreflexion, Einbindung neuer Mitglieder und konstruktives Streiten sind dagegen typische Herausforderungen starker Bindungen.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2024/25, Frage 17"},
{"id": "AK25S-05", "s": "S11", "q": "Entrepreneurial teams often experience task conflicts. What is NOT true about task conflicts?", "o": ["They increase the exchange of ideas, decision quality, and venture performance.", "They reduce trust, cooperation, and venture performance.", "They often include disagreements about the content of the team tasks.", "They often entail differences in viewpoints, ideas, and opinions."], "c": 1, "neg": true, "e": "Aufgabenkonflikte fördern Ideenaustausch, Entscheidungsqualität und Performance; Vertrauen und Kooperation zu reduzieren ist typisch für Beziehungskonflikte.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 5"},
{"id": "AK25S-10", "s": "S11", "q": "According to the lecture, which criterion can be considered when splitting founder equity based on a backward orientation?", "o": ["Prior experiences.", "Opportunity cost.", "Titles.", "All of the above."], "c": 1, "neg": false, "e": "Laut Schlüssel sind Opportunitätskosten ein Kriterium der Backward Orientation (bisherige Beiträge/Verzicht). Titel sind kein solcher Faktor.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 10"},
{"id": "AK25S-15", "s": "S11", "q": "According to the lecture, which of the following challenges is most likely to arise in a co-founding team with strong ties?", "o": ["Difficulty defining team member roles due to a lack of prior history.", "High levels of relational uncertainty.", "Difficulty defining team member roles due to their prior personal history.", "Lack of psychological safety."], "c": 2, "neg": false, "e": "Bei starken Bindungen erschwert die gemeinsame persönliche Vorgeschichte die Klärung der Rollen im Team (alte Rollen werden nicht reflektiert).", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 15"},
{"id": "AK25S-16", "s": "S11", "q": "Two co-founders are setting up a company. Founder A has developed the core idea and spent a year working on the prototype. Founder B has industry connections and will secure funding for the startup. In their equity negotiations, Founder B insists on a 50% split, despite not having contributed any work so far. According to our discussions in the lecture, what would you recommend the two founders?", "o": ["Agree to an equal split to avoid emotional disputes and maintain harmony.", "Use vesting to ensure equity is earned over time based on contributions.", "Prioritize Founder A's initial contributions and allocate them a higher equity stake.", "Prioritize Founder B's connection in the industry and allocate them a higher equity stake."], "c": 1, "neg": false, "e": "Vesting sorgt dafür, dass Anteile über die Zeit entsprechend den tatsächlichen Beiträgen erdient werden – das löst den Konflikt fair.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 16"},
{"id": "AK25S-29", "s": "S11", "q": "We have discussed different approaches to equity splits. Which of the following is NOT a factor considered in backward orientation?", "o": ["Idea premium.", "Capital contribution.", "Opportunity costs.", "Titles in the startup."], "c": 3, "neg": true, "e": "Bei der Backward Orientation wird Equity nach bisherigen Beiträgen verteilt (Ideenprämie, Kapitaleinlage, Opportunitätskosten). Titel im Startup sind kein solcher Faktor.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 29", "also": ["WS 2024/25, Frage 14"]},
{"id": "AK25W-22", "s": "S11", "q": "What is true about the equity split in entrepreneurial teams?", "o": ["Teams that rely on vesting are less attractive for venture capitalists.", "Teams that rely on a forwards orientation will particularly value the team members’ commitment to the venture.", "Teams that split the equity equally can avoid conflicts around the equity distribution.", "Teams that split the equity late often rely on a backwards orientation."], "c": 1, "neg": false, "e": "Bei einer Forward Orientation werden Anteile nach künftigen Beiträgen verteilt – daher zählt das Commitment der Teammitglieder zum Venture besonders.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2025/26, Frage 22", "also": ["SS 2023, Frage 4", "SS 2024, Frage 4"]},
{"id": "AK25W-25", "s": "S11", "q": "An entrepreneur is considering whom to bring on as co-founders. One option is a close friend with whom she has worked before; another option is a professional acquaintance she met recently who brings highly complementary industry expertise. Based on the lecture’s distinction between strong and weak ties, which statement best reflects the implications of these choices?", "o": ["Limited familiarity makes long-term coordination almost impossible, so she should not choose her professional acquaintance.", "Strong ties can reduce relational uncertainty, that would be a benefit choosing the close friend.", "Weak-ties as co-founders should be avoided especially in the early stages of venture development, so it is better to go with the close friend.", "Strong ties lead to better team performance, she should therefore choose her professional acquaintance."], "c": 1, "neg": false, "e": "Starke Bindungen (enge Freundin) reduzieren relationale Unsicherheit – ein Vorteil bei der Wahl der Freundin.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2025/26, Frage 25"},
{"id": "AK26S-08", "s": "S11", "q": "Which founding teams can benefit from a team charter or co-founder agreement and why?", "o": ["Teams based on weak ties because the charter can help the team members to open up to new teammates.", "Teams based on strong ties because the charter can help professionalize relationships.", "Teams based on strong ties because the charter can help maximize the founding team’s human capital.", "Teams based on weak ties because the charter can help develop ideas outside the joint knowledge corridor."], "c": 1, "neg": false, "e": "Teams aus starken Bindungen profitieren von einer Team-Charta, weil sie hilft, Beziehungen zu professionalisieren (Rollen, Erwartungen, Konfliktregeln).", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 8"},
{"id": "AK26S-24", "s": "S11", "q": "According to the lecture, why is it difficult to simply conclude that either heterogeneous or homogeneous founding teams always perform better?", "o": ["Because homogeneity mainly matters in later stages of venture development, while heterogeneity is more important in earlier stages.", "The conclusion is not difficult, because empirical studies show that heterogeneous teams are less stable and therefore should generally be avoided.", "Because the benefits and challenges of both types depend on how the team members manage the team.", "Because team performance is mostly determined by prior industry experience, not by team composition."], "c": 2, "neg": false, "e": "Ob heterogene oder homogene Teams besser abschneiden, hängt davon ab, wie die Mitglieder ihr Team managen – beide Typen haben Vor- und Nachteile.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 24"},
{"id": "AK26S-29", "s": "S11", "q": "According to Klotz et al.’s (2014) Input-Mediator-Outcome framework of entrepreneurial teams, which factor can act as a mediator between team characteristics and team outcomes?", "o": ["Prior experience.", "Sales growth.", "Personality.", "Team conflict."], "c": 3, "neg": false, "e": "Teamkonflikte sind ein Mediator: Sie werden durch Teammerkmale (z. B. Zusammensetzung) ausgelöst und beeinflussen die Teamergebnisse.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 29", "also": ["WS 2024/25, Frage 5", "SS 2025, Frage 33", "WS 2025/26, Frage 26"]},
{"id": "AK26S-30", "s": "S11", "q": "Which of the following is an example of a vesting model?", "o": ["A method for allocating all shares to founders and employees immediately upon joining a startup.", "A structured schedule in which equity is gradually distributed to founders or employees over time.", "A process in which company shares are distributed only after the company becomes profitable.", "A model for determining the percentage of profits each founder receives annually."], "c": 1, "neg": false, "e": "Vesting: Anteile werden nach einem festen Zeitplan schrittweise über die Zeit an Gründer oder Mitarbeitende übertragen.", "src": "S11 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 30", "also": ["WS 2024/25, Frage 18", "SS 2025, Frage 25"]},
{"id": "AK25W-03", "s": "S12", "q": "According to the guest lecture by Leonhard from Circular Republic, where does the circular economy offer the strongest leverage for impact?", "o": ["During recycling, since recovering materials from waste streams provides the largest environmental benefits.", "At the disposal stage, where efficient sorting systems enable better waste management.", "During marketing, by encouraging customers to return products at end of life.", "At the design stage, where decisions determine whether products can be repaired, reused, or kept in circulation."], "c": 3, "neg": false, "e": "Laut Circular Republic liegt der größte Hebel in der Designphase: Dort wird entschieden, ob Produkte repariert, wiederverwendet oder im Kreislauf gehalten werden können.", "src": "S12 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2025/26, Frage 3"},
{"id": "AK25W-12", "s": "S12", "q": "What is the overarching goal of the circular economy, according to our guest lecturer Leonhard from Circular Republic?", "o": ["Shifting value creation entirely from products to services.", "Separating economic growth from the continuous extraction of new raw materials.", "To reduce waste primarily through consumer behavior and improved disposal systems.", "Companies should focus on minimizing emissions at every production stage."], "c": 1, "neg": false, "e": "Ziel der Kreislaufwirtschaft ist es, Wirtschaftswachstum von der fortlaufenden Entnahme neuer Rohstoffe zu entkoppeln.", "src": "S12 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2025/26, Frage 12"},
{"id": "AK26S-03", "s": "S12", "q": "What challenge did our guest lecturer Leonhard from Circular Republic highlight regarding today’s logistics systems in the context of circular economy models?", "o": ["They already fully support circular flows for most product categories.", "They are limited primarily because most products cannot be technically disassembled.", "None of the options is correct.", "They are optimized for one-way flows toward users, making it difficult to retrieve products or materials for circular loops."], "c": 3, "neg": false, "e": "Heutige Logistiksysteme sind auf Einwegflüsse zum Nutzer optimiert; Produkte und Materialien für Kreisläufe zurückzuholen, ist schwierig.", "src": "S12 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 3", "also": ["WS 2025/26, Frage 27"]},
{"id": "AK26S-26", "s": "S12", "q": "According to our lecture with Leonhard from Circular Republic, materials are kept in productive loops in a circular economy through which three actions on material flows?", "o": ["Sourcing, refining, and disposing.", "Extracting, manufacturing, and repairing.", "Narrowing (use less), slowing (use longer), and closing (use again).", "Reducing, reusing, and recycling."], "c": 2, "neg": false, "e": "In der Kreislaufwirtschaft werden Materialflüsse verengt (weniger nutzen), verlangsamt (länger nutzen) und geschlossen (wieder nutzen).", "src": "S12 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 26"},
{"id": "AK22W-03", "s": "S13", "q": "What is true about firm categories and their prevalence?", "o": ["The number of unicorns world-wide has decreased in the last years.", "Decacorns are firms valued at over USD 100 billion.", "Starbucks and CISCO were examples of Gazelle firms in their firm development.", "All of the above."], "c": 2, "neg": false, "e": "Laut Schlüssel waren Starbucks und Cisco in ihrer Entwicklung Beispiele für Gazellen (sehr schnell wachsende junge Firmen). Decacorns sind ab 10 Mrd. USD bewertet, und die Zahl der Unicorns ist in den letzten Jahren gestiegen.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2022/23, Frage 3"},
{"id": "AK22W-23", "s": "S13", "q": "Greiner (1972) has defined five specific phases of growth as well as crisis that come with growth. According to the lecture, which crisis is characterized by too strict structures and the call for more creativity?", "o": ["Crisis of autonomy", "Crisis of control", "Crisis of red tape", "Crisis of leadership"], "c": 2, "neg": false, "e": "Nach Greiner (1972) folgt auf das Wachstum durch Koordination die Bürokratie-Krise (crisis of red tape): zu starre Strukturen, Ruf nach mehr Kollaboration/Kreativität.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2022/23, Frage 23"},
{"id": "AK22W-25", "s": "S13", "q": "In order to grow, firms may apply a market development strategy. It is a strategy to grow by…", "o": ["… developing and selling new products to people who are already purchasing the firm’s existing products.", "… selling the firm’s existing products to new groups of customers.", "… encouraging existing customers to buy more of the firm’s current products.", "… selling a new product to a new market."], "c": 1, "neg": false, "e": "Marktentwicklung (Ansoff) heißt: bestehende Produkte an neue Kundengruppen/Märkte verkaufen.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2022/23, Frage 25"},
{"id": "AK23S-24", "s": "S13", "q": "In the early days of the Head Ski Company, it only produced and sold high-tech skis in the US market. Which of the following would, according to the Ansoff Matrix, NOT be an example of a diversification strategy for this case?", "o": ["Design and manufacture of equipment used to make skis.", "Sell skis in diverse markets, such as Europe, Argentina, and Japan.", "Open a chain of retail ski shops.", "Ownership of ski mountains."], "c": 1, "neg": true, "e": "Diversifikation heißt: neue Produkte in neuen Märkten (z. B. Maschinen für Skiherstellung, Ski-Shops, Skigebiete). Bestehende Ski in neuen Ländern zu verkaufen ist dagegen Marktentwicklung.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2023, Frage 24"},
{"id": "AK23S-29", "s": "S13", "q": "What is true about scale-ups according to Piaskowska et al. (2021)?", "o": ["They need to find a balance between exploration and exploitation.", "They need to synchronize their internal organization with high growth.", "They need to deal with decelerated product life cycles.", "They need to build up a highly flexible and agile structure."], "c": 1, "neg": false, "e": "Laut Piaskowska et al. (2021) müssen Scale-ups ihre interne Organisation mit dem hohen Wachstum synchronisieren (Rekonfiguration interner Ressourcen und Aktivitäten).", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2023, Frage 29", "also": ["WS 2022/23, Frage 27"]},
{"id": "AK23S-34", "s": "S13", "q": "In one of our guest lectures, we had the pleasure to welcome Celonis, who are an outstanding example of a German decacorn. What exactly is a decacorn?", "o": ["A company that had 10 successful unicorn spin-offs.", "A company valued at more than US $1 Billion.", "A company whose sales revenue grew by US $1 Billion over the last decade.", "A company valued at more than US $10 Billion."], "c": 3, "neg": false, "e": "Ein Decacorn ist ein (privates) Unternehmen mit einer Bewertung von über 10 Mrd. US-Dollar.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2023, Frage 34", "also": ["WS 2022/23, Frage 33"]},
{"id": "AK23W-23", "s": "S13", "q": "Based on the explanation of scaling by Bohan et al. (2023), please consider two firms, A and B, described in the following scenarios. In which of the scenarios could you state that Firm A is growing but not scaling, while Firm B exhibits characteristics of scaling?", "o": ["Firm A's sales plan lacks a clear growth rhythm, while Firm B adheres to a consistent year-on-year growth pattern.", "Firm A is planning a fixed annual sales increase, while Firm B adopts a 40 % year-on-year revenue growth.", "Firm A's growth curve follows a 'hockey-stick' profile, while Firm B's growth lacks a proportional increase over time.", "Firm A's sales plan leads to a moderate increase by year 10, while Firm B experiences sustained growth."], "c": 1, "neg": false, "e": "Skalierung (Bohan et al., 2023) bedeutet überproportionales, exponentielles Wachstum: Firma B mit 40 % Wachstum pro Jahr skaliert, Firma A mit fixer jährlicher Steigerung wächst nur linear.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2023/24, Frage 23"},
{"id": "AK23W-26", "s": "S13", "q": "Greiner (1972) has defined five specific phases of growth as well as crises that come with growth. According to the lecture, which crisis is characterized by a lack of formal structures and the need for more professional processes?", "o": ["Crisis of autonomy.", "Crisis of control.", "Crisis of red tape.", "Crisis of leadership."], "c": 3, "neg": false, "e": "Nach Greiner folgt auf das kreative Wachstum die Führungskrise (crisis of leadership): fehlende formale Strukturen, Bedarf an professionellem Management.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2023/24, Frage 26"},
{"id": "AK24S-18", "s": "S13", "q": "In alignment with Ansoff's (1957) matrix, what growth strategy does a company employ when it actively encourages its current customer base to increase their purchases of the firm's existing products?", "o": ["Product development strategy", "Market development strategy", "Penetration strategy", "Diversification strategy"], "c": 2, "neg": false, "e": "Bestehende Kunden zu mehr Käufen bestehender Produkte zu bewegen, ist Marktdurchdringung (Penetration) in der Ansoff-Matrix.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2024, Frage 18", "also": ["WS 2023/24, Frage 1"]},
{"id": "AK24S-21", "s": "S13", "q": "In line with the description of scaling discussed in lecture, which statement concerning revenues and costs is NOT appropriate?", "o": ["Costs can be higher than revenues at the time a firm is started.", "Revenues and costs grow at the same pace at a later stage of the firm.", "Revenues grow at a faster pace than costs at a later stage of the firm.", "Revenues are likely to grow exponentially and costs linearly."], "c": 1, "neg": true, "e": "Beim Skalieren wachsen die Erlöse in späteren Phasen schneller (oft exponentiell) als die Kosten (eher linear). Dass Erlöse und Kosten gleich schnell wachsen, ist daher nicht zutreffend.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2024, Frage 21"},
{"id": "AK24S-28", "s": "S13", "q": "In the context of the initial four phases of growth, which type of crisis has Greiner (1972) NOT included?", "o": ["Crisis of autonomy", "Crisis of control", "Crisis of leadership", "Crisis of innovation"], "c": 3, "neg": true, "e": "Greiners erste vier Phasen enden mit den Krisen der Führung, Autonomie, Kontrolle und Bürokratie (red tape). Eine 'Krise der Innovation' gibt es im Modell nicht.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2024, Frage 28"},
{"id": "AK24W-02", "s": "S13", "q": "Entrepreneurs in the startup phase typically enact roles that…", "o": ["…are overlapping and focus on external activities.", "…are overlapping and focus on internal activities.", "…are specialized and focus on internal activities.", "…are specialized and focus on both internal and external activities."], "c": 1, "neg": false, "e": "Laut Schlüssel übernehmen Gründer in der Startup-Phase überlappende Rollen und konzentrieren sich auf interne Aktivitäten (Produkt, Aufbau der Organisation); spezialisierte Rollen entstehen erst mit dem Wachstum.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2024/25, Frage 2"},
{"id": "AK25S-06", "s": "S13", "q": "When the augmented reality mobile game Pokémon Go was released in July 2016, it took only 19 days for the game to have 50 million users. Thus, it reached the threshold of 50 million users much faster than innovations such as airlines or electricity, which entered the market decades ago. Which of the following is NOT the reason for this achievement?", "o": ["Global trend of digitalization.", "Freemium model of the game.", "First-mover strategy.", "Late-mover strategy."], "c": 2, "neg": true, "e": "Pokémon Go profitierte von Digitalisierung, Freemium-Modell und einer Late-Mover-Strategie (vorhandene AR-Technologie/Spiele). Eine First-Mover-Strategie war gerade nicht der Grund.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 6", "also": ["SS 2023, Frage 16"]},
{"id": "AK25S-07", "s": "S13", "q": "In our guest lecture with Celonis, we learned that Celonis is considered a “decacorn.” What does this term refer to?", "o": ["A startup with more than ten international office locations.", "A company that has grown particularly sustainably over a period of ten years.", "A privately held startup company valued at over $10 billion.", "A unicorn that reinvests at least 10% of its profits in climate initiatives."], "c": 2, "neg": false, "e": "Ein Decacorn ist ein privat gehaltenes Startup mit einer Bewertung von über 10 Mrd. USD.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 7"},
{"id": "AK25S-19", "s": "S13", "q": "According to the study by Piaskowska et al. (2021) presented in the lecture, what is a key difference between a scale-up and a start-up regarding their growth-related challenges?", "o": ["Start-up firms usually face resource constraints, whereas scale-up firms struggle to manage at their larger size and complexity.", "Start-ups struggle to implement structures, whereas scale-up firms need to balance exploration and exploitation.", "Start-up firms usually face resource constraints, whereas scale-ups are challenged by reconfiguring their internal resources and activities.", "Start-ups struggle to maintain efficiency, whereas scale-up firms need to synchronize their internal organization."], "c": 0, "neg": false, "e": "Piaskowska et al. (2021): Start-ups kämpfen v. a. mit Ressourcenknappheit, Scale-ups mit dem Management ihrer größeren Größe und Komplexität.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 19"},
{"id": "AK25S-26", "s": "S13", "q": "According to the lecture, what is true about start-ups classified as \"zebras\"?", "o": ["They emphasize mutualistic relationships and communities.", "They are extremely rare.", "They are valued at over 1 billion USD.", "Their main goal is scaling."], "c": 0, "neg": false, "e": "Zebras betonen mutualistische Beziehungen und Gemeinschaften statt reiner Skalierung.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2025, Frage 26", "also": ["WS 2024/25, Frage 25"]},
{"id": "AK25W-04", "s": "S13", "q": "The opportunity to influence the formation of customer perceptions and preferences is an important advantage for which specific market entry strategy?", "o": ["Late-mover strategy.", "First-mover strategy.", "High-growth strategy.", "Scaling strategy."], "c": 1, "neg": false, "e": "First Mover können Wahrnehmungen und Präferenzen der Kunden prägen (z. B. Standards setzen) – ein zentraler First-Mover-Vorteil.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2025/26, Frage 4", "also": ["WS 2024/25, Frage 19", "SS 2025, Frage 28"]},
{"id": "AK25W-09", "s": "S13", "q": "Which statement best captures a key difference between startup-stage and growth-stage entrepreneurs discussed in the lecture?", "o": ["Startup-stage entrepreneurs mainly rely on formal procedures, while growth-stage entrepreneurs depend on improvisation and trial-and-error.", "Startup-stage entrepreneurs focus on exploring opportunities and shaping the business model, whereas growth-stage entrepreneurs emphasize scaling structures, processes, and teams.", "Startup-stage entrepreneurs manage large teams and complex hierarchies, while growth-stage entrepreneurs work alone or in very small groups.", "Startup-stage entrepreneurs often hold very specialized roles, while growth-stage entrepreneurs typically have overlapping roles."], "c": 1, "neg": false, "e": "In der Startup-Phase erkunden Gründer Gelegenheiten und formen das Geschäftsmodell; in der Wachstumsphase stehen skalierbare Strukturen, Prozesse und Teams im Vordergrund.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2025/26, Frage 9"},
{"id": "AK25W-29", "s": "S13", "q": "One major challenge for startups is managing growth. Imagine you are the founder of a startup that produces cereal bars made of oats. What could you do to grow your startup?", "o": ["Following a penetration strategy, you could start selling your cereal bars in a new country (e.g. France or Italy).", "Following a market development strategy, you could start selling breakfast oats directly to the customer.", "Following a product development strategy, you could invest in a powerful marketing campaign to convince your customers to have cereal bars for breakfast as well as for snacks.", "Following a backward integration strategy, you could start producing your own oats."], "c": 3, "neg": false, "e": "Eigenen Hafer zu produzieren, ist Rückwärtsintegration (vorgelagerte Wertschöpfungsstufe). Die anderen Optionen ordnen die Strategien falsch zu.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur WS 2025/26, Frage 29"},

{"id": "AK26S-31", "s": "S13", "q": "Why is Pokémon Go often considered a strong example of a late-mover strategy?", "o": ["Because late movers typically ignore existing user behavior, which Pokémon Go used as part of its launch strategy.", "Because it created a new market category with no predecessors or comparable products.", "Because it was the first mobile game to use augmented reality, giving it a technological advantage.", "Because it entered the mobile gaming market after many others, but could leverage proven technologies."], "c": 3, "neg": false, "e": "Pokémon Go kam spät in einen etablierten Mobile-Gaming-Markt, konnte aber bewährte Technologien (AR, GPS, Ingress-Daten) nutzen – typischer Late-Mover-Vorteil.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 31"},
{"id": "AK26S-32", "s": "S13", "q": "A firm merges with another firm in the same industry value chain. This is an example of", "o": ["Horizontal integration.", "Backwards integration.", "Forwards integration.", "None of the above."], "c": 0, "neg": false, "e": "Laut Schlüssel ist der Zusammenschluss mit einer Firma derselben Branche/Wertschöpfungsstufe horizontale Integration; vertikale Integration (rückwärts/vorwärts) betrifft vor- oder nachgelagerte Stufen.", "src": "S13 (Folien noch nicht verfügbar)", "origin": "Altklausur SS 2026, Frage 32"},

{"id": "AK23W-33", "s": "SX", "q": "Our guest, Nina Winklhofer from Selphspace, explained they pivoted a couple of times. What were the main changes she mentioned?", "o": ["Instead of focusing on patients they completely shifted their focus to developing their app for therapists only.", "They decided to focus more narrowly on supporting patients with one particular disorder to become a unique player in this field.", "They went from only digitizing therapy for patients with one particular disorder to targeting a broader group of patients as well as easing the workload for therapists.", "They redesigned the app to support personal training and help athletes to track their training progress."], "c": 2, "neg": false, "e": "Selphspace hat von der Digitalisierung der Therapie für Patienten mit einer bestimmten Störung zu einer breiteren Patientengruppe und zusätzlicher Entlastung der Therapeuten pivotiert.", "origin": "Altklausur WS 2023/24, Frage 33"},
{"id": "AK23W-34", "s": "SX", "q": "According to Schaltegger and Wagner's (2011) overview of prototypical forms of entrepreneurship, what is the core motivation for sustainable entrepreneurship?", "o": ["Contribute to solving societal problems and create value for society.", "Contribute to solving societal problems and environmental problems through the realization of a successful business.", "Contribute to solving environmental problems and create economic value.", "Contribute to long-term personal gain and create economic value."], "c": 1, "neg": false, "e": "Nach Schaltegger & Wagner (2011) wollen nachhaltige Unternehmer zur Lösung gesellschaftlicher und ökologischer Probleme beitragen, indem sie ein erfolgreiches Geschäft realisieren.", "origin": "Altklausur WS 2023/24, Frage 34"},
{"id": "AK23W-35", "s": "SX", "q": "Which statement is in line with Van der Aalst’s (2016) definition of process mining?", "o": ["Process Mining is an analytical approach that relies on process information provided through surveys and interviews with experts in a company.", "Process Mining is a data analytics technology to reconstruct, analyze, and improve business processes based on log data from transactional IT systems.", "Process Mining helps to display deviations from the most common process but it is not suitable to find out more about the root causes of issues.", "Process Mining enlarges the gap between model-based process analyses and data-centric analysis techniques."], "c": 1, "neg": false, "e": "Van der Aalst (2016) definiert Process Mining als Datenanalyse-Technologie, die Geschäftsprozesse auf Basis von Log-Daten aus Transaktionssystemen rekonstruiert, analysiert und verbessert.", "origin": "Altklausur WS 2023/24, Frage 35"},
