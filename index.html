<style>
/* Basis-Reset (vorher vom Host gesetzt) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0;font:14px system-ui}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: wie TUM-Webseiten – dunkelblauer Kopf über volle Breite, links Navigationsleiste (Sessions), Mitte Inhalt mit Breadcrumb, rechts Infokasten */
:root{
  --top:#072140; --head:#0b2a4f; --nav:#0b2a4f; --nav-active:#14427a; --nav-ink:#ffffff;
  --bg:#ffffff; --surface:#ffffff; --box:#edf1f6; --ink:#072140; --text:#1f2a37; --muted:#5f6b7a; --line:#d5dce5;
  --link:#3070b3; --accent:#3070b3; --accent-soft:#e6eef8;
  --right:#4f6c0e; --right-bar:#9fba36; --right-soft:#eef4dc; --wrong:#c4071b; --wrong-soft:#fbe6e8; --open:#d0d6de;
  --font:"Roboto", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --top:#030f1f; --head:#061a33; --nav:#0a2545; --nav-active:#17447c; --nav-ink:#ffffff;
  --bg:#0c1726; --surface:#112036; --box:#14263f; --ink:#ffffff; --text:#d9e2ee; --muted:#9aabc0; --line:#24395a;
  --link:#7fb0ea; --accent:#5e94d4; --accent-soft:#163457;
  --right:#b4cf4f; --right-bar:#9fba36; --right-soft:#1e3320; --wrong:#f07a7f; --wrong-soft:#3a1622; --open:#2a4569;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --top:#030f1f; --head:#061a33; --nav:#0a2545; --nav-active:#17447c; --nav-ink:#ffffff;
  --bg:#0c1726; --surface:#112036; --box:#14263f; --ink:#ffffff; --text:#d9e2ee; --muted:#9aabc0; --line:#24395a;
  --link:#7fb0ea; --accent:#5e94d4; --accent-soft:#163457;
  --right:#b4cf4f; --right-bar:#9fba36; --right-soft:#1e3320; --wrong:#f07a7f; --wrong-soft:#3a1622; --open:#2a4569;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;background:none;border:0;padding:0}
button:focus-visible{outline:3px solid #5e94d4;outline-offset:2px}
h1,h2{margin:0;color:var(--ink);text-wrap:balance;line-height:1.15;font-weight:700}

/* Kopf */
.topstrip{background:var(--top);color:#fff;font-size:14px}
.headband{background:var(--head);color:#fff}
.inner{max-width:1280px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.topstrip .inner{display:flex;justify-content:flex-end;gap:18px;padding-block:8px;flex-wrap:wrap}
.topstrip b{font-weight:700}
.headband .inner{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:28px;flex-wrap:wrap}
.site{font-size:16px;line-height:1.25}
.site span{display:block}
.wordmark{font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:-.01em;line-height:1}

/* Seitenraster */
.page{max-width:1280px;margin:0 auto;padding:20px var(--gut-r) 48px var(--gut-l);display:grid;grid-template-columns:1fr;gap:24px}
@media (min-width:900px){.page{grid-template-columns:270px minmax(0,1fr)}}
@media (min-width:1200px){.page{grid-template-columns:270px minmax(0,1fr) 270px}}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
@media (max-width:899px){.main{order:-1}}

/* Navigation */
.nav{background:var(--nav);align-self:start;padding-block:6px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:var(--nav-ink);padding:11px 16px;font-size:17px;line-height:1.3;min-height:48px}
.nav button .id{font-size:13px;opacity:.75;flex:none;font-variant-numeric:tabular-nums}
.nav button.active{background:var(--nav-active);font-weight:700}
.nav button.locked{opacity:.6}
@media (hover:hover){.nav button:hover{background:var(--nav-active)}}
.nav .navhead{color:var(--nav-ink);font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;padding:10px 16px 4px}
.quizmode .nav{display:none}
@media (min-width:900px){.quizmode .nav{display:block}}

/* Breadcrumb */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--text);align-items:center}
.crumbs button{color:var(--text)}
.crumbs button:hover{color:var(--link);text-decoration:underline}
.crumbs .sep{color:var(--muted)}
h1.title{font-size:clamp(28px,5vw,44px);letter-spacing:-.01em}
.lead{margin:0;max-width:62ch}

/* Infokasten */
.aside{background:var(--box);padding:18px 20px;align-self:start;display:flex;flex-direction:column;gap:10px}
.aside h2{font-size:21px}
.aside p{margin:0;font-size:15.5px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;display:inline-block;flex:none}
@media (min-width:900px) and (max-width:1199px){.aside{grid-column:2}}

/* Fortschritt */
.bar{display:flex;height:8px;overflow:hidden;background:var(--open)}
.bar i{display:block;height:100%}
.counts{display:flex;gap:20px;font-size:16px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.counts b{font-weight:700}
.c-right{color:var(--right)} .c-wrong{color:var(--wrong)} .c-open{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:48px;padding:10px 22px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink)}
.btn.primary{min-height:56px;background:#3070b3;border-color:#3070b3;color:#fff}
.btn.ghost{background:transparent;color:var(--link)}
.btn:disabled{opacity:.45;cursor:default}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;background:var(--wrong-soft);padding:10px 12px}
.meta{font-size:14px;color:var(--muted)}
.overview{display:flex;flex-direction:column;gap:14px;padding-top:4px}

/* Quiz */
.qhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;background:var(--accent-soft);color:var(--accent)}
.chip.neg{background:var(--wrong-soft);color:var(--wrong)}
.chip.repeat{border:1px solid var(--line);color:var(--muted);background:transparent}
.qtext{font-size:clamp(21px,3vw,26px);font-weight:700;line-height:1.3;margin:0;color:var(--ink);max-width:40ch}
.qtext em{font-style:normal;color:var(--wrong);text-decoration:underline;text-underline-offset:4px}
.qfig{margin:0;max-width:100%;border:1px solid var(--line);background:#fff;padding:8px;align-self:flex-start}
.qfig img{display:block;max-width:100%;height:auto;background:#fff}
.qfig .zoom{display:block;width:100%;cursor:zoom-in;background:#fff}
.qfig figcaption{font-size:13px;color:#5f6b7a;margin-top:6px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(3,10,20,.92);display:flex;align-items:center;justify-content:center;
  padding:max(56px, calc(env(safe-area-inset-top,0px) + 56px)) max(12px, env(safe-area-inset-right,0px)) max(12px, env(safe-area-inset-bottom,0px)) max(12px, env(safe-area-inset-left,0px));
  touch-action:manipulation;overscroll-behavior:contain}
.lightbox[hidden]{display:none}
.lightbox img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#fff;padding:6px;touch-action:manipulation}
.lightbox .lb-close{position:absolute;top:max(8px, env(safe-area-inset-top,0px));right:max(8px, env(safe-area-inset-right,0px));width:48px;height:48px;display:grid;place-items:center;font-size:30px;line-height:1;color:#fff;background:rgba(255,255,255,.14)}
.lightbox .lb-close:hover{background:rgba(255,255,255,.26)}
html.lb-open,html.lb-open body{overflow:hidden}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;min-height:56px;padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--line);background:var(--surface);line-height:1.4;color:var(--text)}
.opt .let{flex:none;width:30px;height:30px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--head);color:#fff}
.opt .txt{min-width:0;padding-top:3px}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent);border-left-color:var(--accent)}}
.opt:disabled{cursor:default}
.opt.is-right{border-color:var(--right-bar);background:var(--right-soft)}
.opt.is-right .let{background:var(--right-bar)}
.opt.is-wrong{border-color:var(--wrong);background:var(--wrong-soft)}
.opt.is-wrong .let{background:var(--wrong)}
.opt.dim{opacity:.55}
.feedback{padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-left:4px solid}
.feedback.ok{background:var(--right-soft);border-color:var(--right-bar)} .feedback.no{background:var(--wrong-soft);border-color:var(--wrong)}
.feedback strong{font-size:19px}
.feedback.ok strong{color:var(--right)} .feedback.no strong{color:var(--wrong)}
.feedback p{margin:0}
.feedback .src{font-size:14px;color:var(--muted)}
.next{min-height:56px;width:100%;font-size:18px}
@media (min-width:600px){.next{width:auto;min-width:220px}}
.big{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.footer{border-top:1px solid var(--line)}
.footer .inner{padding-block:18px;font-size:14px;color:var(--muted);display:flex;gap:24px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

{"id": "AK24S-31", "s": "S01", "q": "Which of the following is NOT a reason why the entrepreneurial journey is often compared to climbing a mountain?", "o": ["Because it can be a difficult and risky journey until you reach the top.", "Because the further you climb, the more experience you earn.", "Because you must be an experienced mountaineer to be able to reach the top.", "Because in both fields, you can be a pioneer in your area."], "c": 2, "neg": true, "e": "Die Bergsteiger-Metapher betont Schwierigkeit/Risiko, wachsende Erfahrung und Pioniergeist. Dass man schon erfahrener Bergsteiger sein muss, ist kein Grund – Gründen kann man auch ohne Erfahrung.", "src": "S01 Folie 27", "origin": "Altklausur SS 2024, Frage 31"},
{"id": "AK25W-17", "s": "S01", "q": "According to the definition of entrepreneurship in the lecture (adapted from Shane and Venkatamaran, 2000), what is true about entrepreneurship?", "o": ["Entrepreneurship refers to specific characteristics inherent in a person.", "Entrepreneurship refers to the creation of something new.", "Entrepreneurship refers exclusively to the process of creating a new firm.", "Entrepreneurship refers to the discovery, evaluation, and exploitation of opportunities to generate profit."], "c": 1, "neg": false, "e": "Laut Vorlesungsdefinition (adaptiert von Shane & Venkataraman, 2000) ist Entrepreneurship das Entdecken, Bewerten und Nutzen von Gelegenheiten, um etwas Neues zu schaffen (neue Produkte, Märkte, Prozesse, Organisationsformen). Die Variante „… to generate profit“ verfälscht die Definition; Entrepreneurship ist weder an Persönlichkeitsmerkmale noch ausschließlich an Firmengründung gebunden.", "src": "S01 Folie 28", "origin": "Altklausur WS 2025/26, Frage 17", "also": ["WS 2023/24, Frage 24"]},
{"id": "AK23S-25", "s": "S01", "q": "Which statement is true about the \"total entrepreneurial activity rate\" of a country?", "o": ["It is only high in countries with a high GDP/capita.", "In most countries, it is above 50%.", "It represents the success of entrepreneurs operating in a given country.", "None of the above."], "c": 3, "neg": false, "e": "Die TEA-Rate misst den Anteil Erwachsener, die gerade gründen oder ein junges Unternehmen führen. Sie ist nicht nur in reichen Ländern hoch, liegt fast nie über 50 % und misst keinen Erfolg.", "src": "S01 Folie 29–30", "origin": "Altklausur SS 2023, Frage 25", "also": ["WS 2022/23, Frage 19"]},

{"id": "AK25W-32", "s": "S01", "q": "Based on data from the Global Entrepreneurship Monitor (GEM) 2024/2025, what is true about the relationship between a country’s Total Entrepreneurial Activity (TEA) rate and its GDP per capita?", "o": ["A lower GDP per capita is associated with higher TEA rates, but the relationship is not causal.", "There is a causal relationship between TEA rates and a country’s GDP per capita: Higher TEA rates increase a country’s GDP per capita.", "There is a causal relationship between TEA rates and a country’s GDP per capita: Higher TEA rates reduce a country’s GDP per capita.", "All countries with high GDP per capita show high TEA rates."], "c": 0, "neg": false, "e": "Laut GEM 2024/2025 gehen niedrigeres BIP pro Kopf und höhere TEA-Raten tendenziell einher – das ist aber eine Korrelation, kein Kausalzusammenhang.", "src": "S01 Folie 30", "origin": "Altklausur WS 2025/26, Frage 32"},

{"id": "AK24S-26", "s": "S01", "q": "According to the lecture, what is a fundamental trait of capitalism according to Joseph Schumpeter?", "o": ["Maximization of profits.", "Reallocation of wealth from working class to top management.", "Process of creative destruction.", "Selling products even if there is no customer need."], "c": 2, "neg": false, "e": "Schumpeter bezeichnet den Prozess der schöpferischen Zerstörung als fundamentales Merkmal des Kapitalismus.", "src": "S01 Folie 31", "origin": "Altklausur SS 2024, Frage 26", "also": ["WS 2022/23, Frage 29", "WS 2023/24, Frage 29"]},
{"id": "AK25S-11", "s": "S01", "q": "The economist Joseph Schumpeter stated that entrepreneurship is the engine of economic growth and referred to the entrepreneurial process as “creative destruction”. Which of the following is an example of \"creative destruction\"?", "o": ["Amazon launching an online service that has changed how consumers purchase products across the world.", "Ridesharing apps making it possible for anyone to order a driver from their phone making taxi services redundant.", "Services to download or stream music online revolutionizing the music industry and creating massive drops in CD sales.", "All of the above."], "c": 3, "neg": false, "e": "Alle drei Beispiele zeigen, wie neue Angebote bestehende Märkte/Produkte verdrängen – schöpferische Zerstörung.", "src": "S01 Folie 31", "origin": "Altklausur SS 2025, Frage 11", "also": ["SS 2023, Frage 2"]},
{"id": "AK26S-17", "s": "S01", "q": "What would Schumpeter consider an example of “creative destruction”?", "o": ["A government subsidy stabilizing declining industries.", "An entrepreneur commercializing a new technology that disrupts established industries and pushes existing products out of the market.", "A firm engaging in incremental improvement of its current processes.", "A company that prevents competitors from entering the market."], "c": 1, "neg": false, "e": "Schöpferische Zerstörung: Eine neue Technologie verdrängt etablierte Produkte und Industrien.", "src": "S01 Folie 31", "origin": "Altklausur SS 2026, Frage 17"},
{"id": "AK23S-18", "s": "S02", "q": "According to the lecture, which of the following is a reason why entrepreneurship can benefit from taking a psychological perspective?", "o": ["Because the entrepreneurs' cognitive processes, emotions, and psychological traits can shape opportunity recognition.", "Because firm-level processes provide a complete explanation for entrepreneurship phenomena.", "Because personality depends on the entrepreneur's current situation and can therefore potentially change how they exploit opportunities from one moment to another.", "Because there is a deterministic relationship between personality traits and success in entrepreneurship."], "c": 0, "neg": false, "e": "Kognitive Prozesse, Emotionen und Persönlichkeit des Gründers prägen die Gelegenheitserkennung – deshalb ist eine psychologische Perspektive hilfreich ('just an economic perspective leaves us less than complete').", "src": "S02 Folie 6, 10, 16", "origin": "Altklausur SS 2023, Frage 18"},
{"id": "AK24W-04", "s": "S02", "q": "What is true about meta-analyses?", "o": ["They facilitate the analysis of relationships across studies.", "They facilitate the analysis of meta-cognition.", "They facilitate the analysis of medium effect sizes only.", "They facilitate the analysis of effects above a certain value."], "c": 0, "neg": false, "e": "Meta-Analysen kombinieren statistisch die Ergebnisse vieler Primärstudien und liefern gewichtete mittlere Effektstärken für Zusammenhänge zwischen Variablen über Studien hinweg.", "src": "S02 Folie 9", "origin": "Altklausur WS 2024/25, Frage 4", "also": ["WS 2022/23, Frage 22", "WS 2023/24, Frage 13"]},
{"id": "AK25S-30", "s": "S02", "q": "In the lecture, we discussed the concept of entrepreneurship research in contrast to research in (at least some) natural sciences, using the metaphor of \"days getting cooler\" vs. \"days getting shorter\" in fall. Which analogy best represents entrepreneurship research?", "o": ["Days are getting shorter.", "Days are getting cooler.", "Days are getting shorter and cooler.", "Days are getting shorter, but not cooler."], "c": 1, "neg": false, "e": "Entrepreneurship-Forschung liefert probabilistische Zusammenhänge mit vielen Einflussfaktoren – wie 'Tage werden kühler' (Tendenz mit Ausnahmen), nicht 'Tage werden kürzer' (deterministisch).", "src": "S02 Folie 9, 16 (thematisch)", "origin": "Altklausur SS 2025, Frage 30", "also": ["WS 2024/25, Frage 29"]},
{"id": "AK22W-30", "s": "S02", "q": "According to the \"Big Five\" personality factors presented in the lecture, one can expect an individual who is instable and struggles to adapt to new situations to have:", "o": ["A high score on introversion.", "A low score on conscientiousness.", "A high score on neuroticism.", "A low score on agreeableness."], "c": 2, "neg": false, "e": "Emotional instabil, schwer an neue Situationen anpassungsfähig – das ist der Pol Neurotizismus (vs. emotionale Stabilität) der Big Five.", "src": "S02 Folie 11", "origin": "Altklausur WS 2022/23, Frage 30"},
{"id": "AK23S-06", "s": "S02", "q": "According to the \"Big Five\" personality factors presented in the lecture, an individual who is friendly, non-competitive, and compassionate is likely to have:", "o": ["A high score on introversion.", "A low score on conscientiousness.", "A high score on neuroticism.", "A high score on agreeableness."], "c": 3, "neg": false, "e": "Freundlich, nicht wettbewerbsorientiert und mitfühlend beschreibt den Pol Verträglichkeit (Agreeableness) der Big Five.", "src": "S02 Folie 11", "origin": "Altklausur SS 2023, Frage 6"},
{"id": "AK23W-08", "s": "S02", "q": "The \"Big Five\" correspond to broad personality factors. Which personality factors out of this group of five factors are typical of (yet not necessary for) entrepreneurs?", "o": ["Emotional stability, antagonism, conscientiousness, openness to experience.", "Neuroticism, achievement orientation, conscientiousness, openness to experience.", "Emotional stability, agreeableness, undirectedness, openness to experience.", "Neuroticism, agreeableness, undirectedness, openness to experience."], "c": 0, "neg": false, "e": "Typisch (aber nicht notwendig) für Unternehmer sind laut Meta-Analysen: emotionale Stabilität, geringere Verträglichkeit (Antagonismus), Gewissenhaftigkeit und Offenheit für Erfahrungen.", "src": "S02 Folie 11–12", "origin": "Altklausur WS 2023/24, Frage 8"},
{"id": "AK24S-12", "s": "S02", "q": "Which statement DEVIATES from the meta-analytical insights presented by Frese & Gielnik (2014)?", "o": ["Entrepreneurs are higher in conscientiousness than managers and conscientiousness has a positive effect on business creation.", "Entrepreneurs are lower in neuroticism than managers and neuroticism has a negative effect on business creation.", "Entrepreneurs are higher in openness to experience than managers and openness to experience has a positive effect on business creation.", "Entrepreneurs are higher in agreeableness than managers and agreeableness has a positive effect on business creation."], "c": 3, "neg": true, "e": "Laut Frese & Gielnik (2014) sind Unternehmer weniger verträglich (agreeable) als Manager; Verträglichkeit hat keinen positiven Effekt auf die Gründung. Diese Aussage weicht also ab.", "src": "S02 Folie 12", "origin": "Altklausur SS 2024, Frage 12"},

{"id": "AK26S-16", "s": "S02", "q": "According to meta-analytic evidence on entrepreneurial personality discussed in the lecture, which statement is correct?", "o": ["Individuals without a typical entrepreneurial personality profile cannot become entrepreneurs.", "Typical entrepreneurial traits fully predict entrepreneurial success.", "Personality effects on entrepreneurial success exist but are small to moderate and not deterministic.", "Personality traits are irrelevant for entrepreneurship and show no significant effects."], "c": 2, "neg": false, "e": "Persönlichkeitseffekte auf unternehmerischen Erfolg existieren, sind aber klein bis moderat und nicht deterministisch.", "src": "S02 Folie 12, 16", "origin": "Altklausur SS 2026, Frage 16"},
{"id": "AK22W-20", "s": "S02", "q": "Entrepreneurs are often characterized by a strong need for autonomy. What is true about the need for autonomy?", "o": ["It corresponds to generalized attitudes and beliefs.", "It is an internal force that pushes people wanting to be in control of decisions independently of others.", "It describes the belief that one can organize and effectively execute actions to produce certain outcomes.", "It is a personality factor that has strong impact on task-oriented behavior."], "c": 1, "neg": false, "e": "Need for autonomy ist ein Motiv, also eine innere Kraft: Präferenz, unabhängig zu entscheiden, eigene Ziele zu setzen und Kontrolle zu haben.", "src": "S02 Folie 14", "origin": "Altklausur WS 2022/23, Frage 20"},
{"id": "AK25W-06", "s": "S02", "q": "Entrepreneurs are often characterized by a strong need for achievement. What is true about the need for achievement?", "o": ["High achievers believe that they can organize and effectively execute actions to produce certain outcomes.", "It is an internal force that pushes people to engage in task-oriented behavior.", "It is a preference for making decisions independently and being in control.", "High achievers have a high need for autonomy."], "c": 1, "neg": false, "e": "Need for achievement ist ein inneres Motiv, das zu aufgabenorientiertem Verhalten antreibt (hohe Standards, Erfolgsstreben).", "src": "S02 Folie 14", "origin": "Altklausur WS 2025/26, Frage 6", "also": ["SS 2023, Frage 22", "SS 2024, Frage 1"]},
{"id": "SK-02", "s": "S02", "q": "What is true about typical motives of entrepreneurs?", "o": ["Because entrepreneurs have a preference for high standards, they were found to have a high need for achievement.", "Because entrepreneurs prefer to set their own goals, they were found to have a low need for achievement.", "Because entrepreneurs prefer to set their own goals, they were found to have a low need for autonomy.", "Because entrepreneurs have a preference for high standards, they were found to have a high need for autonomy."], "c": 0, "neg": false, "e": "Need for achievement ist definiert als Präferenz für hohe (interne oder externe) Standards und Erfolgsstreben; Need for autonomy als Präferenz, eigene Ziele zu setzen und unabhängig zu entscheiden. Beide Motive sind bei Gründern erhöht, nicht niedrig – richtig ist nur die Kombination hohe Standards → hohe Leistungsmotivation.", "src": "S02 Folie 14 (Frese & Gielnik, 2014)", "origin": "Beispielfrage Skript S03 Folie 4"},
{"id": "AK25W-31", "s": "S02", "q": "According to the meta-analytic findings summarized in the paper by Frese and Gielnik (2014) presented in the lecture, what is true about risk-taking propensity in entrepreneurship?", "o": ["Risk-taking propensity only matters at the idea generation stage, not during venture growth.", "Risk-taking propensity is negatively associated with performance in most entrepreneurial contexts.", "Risk-taking propensity is the most important personality trait motivating individuals to become entrepreneurs.", "Risk-taking propensity shows a particularly positive association with performance for growth-oriented entrepreneurs."], "c": 3, "neg": false, "e": "Laut Frese & Gielnik (2014) zeigt Risikobereitschaft einen besonders positiven Zusammenhang mit der Performance bei wachstumsorientierten Unternehmern.", "src": "S02 Folie 15", "origin": "Altklausur WS 2025/26, Frage 31"},
{"id": "AK24S-22", "s": "S02", "q": "What is the main finding of the meta-analysis by Allen et al. (2021) comparing General Mental Ability (GMA) and Emotional Intelligence (EI)?", "o": ["GMA has a stronger overall effect on entrepreneurial success than EI.", "EI has a stronger overall effect on entrepreneurial success than GMA.", "Both GMA and EI have the same effect on entrepreneurial success.", "EI is not as important in an entrepreneurial workplace compared to a traditional workplace."], "c": 1, "neg": false, "e": "Die Meta-Analyse von Allen et al. (2021) zeigt: Emotionale Intelligenz hat einen stärkeren Gesamteffekt auf unternehmerischen Erfolg als allgemeine kognitive Fähigkeit.", "src": "S02 Folie 17", "origin": "Altklausur SS 2024, Frage 22", "also": ["WS 2023/24, Frage 32"]},
{"id": "AK26S-33", "s": "S02", "q": "Which statement best reflects the relationship between Emotional Intelligence (EI) and General Mental Ability (GMA) in entrepreneurship as presented in the lecture?", "o": ["EI and GMA contribute equally to entrepreneurial success.", "EI is less relevant than GMA because entrepreneurs mostly rely on analytical thinking.", "GMA is the primary driver of entrepreneurial success, and EI contributes only marginally.", "EI is even more important for entrepreneurial success than GMA because entrepreneurs are confronted with emotional demands on the entrepreneurial journey."], "c": 3, "neg": false, "e": "Laut Allen et al. (2021) ist emotionale Intelligenz für unternehmerischen Erfolg sogar wichtiger als GMA, weil Unternehmertum emotional stark fordert.", "src": "S02 Folie 17", "origin": "Altklausur SS 2026, Frage 33"},
{"id": "AK24S-09", "s": "S02", "q": "During the lecture, you learned that affect plays an important role in entrepreneurship. According to Baron (2008), which of the following factors can shape entrepreneurs' basic cognitive processes?", "o": ["The entrepreneurs' dispositional affect.", "The entrepreneurs' levels of tolerance for making decisions under stressful situations.", "Capacity to respond effectively to the highly dynamic environments faced by new ventures.", "The entrepreneurs' preference for heuristic thought."], "c": 0, "neg": false, "e": "Nach Baron (2008) beeinflusst Affekt – dispositional oder ereignisbedingt – die grundlegenden kognitiven Prozesse (Informationsverarbeitung, Gedächtnis, Stressbewältigung).", "src": "S02 Folie 18", "origin": "Altklausur SS 2024, Frage 9"},
{"id": "AK23W-21", "s": "S02", "q": "According to the lecture, which mood can help entrepreneurs to analyze their opportunity holistically?", "o": ["A positive mood because it facilitates a global perception of the opportunity.", "A negative mood because it facilitates a global perception of the opportunity.", "A neutral mood because it facilitates a global perception of the opportunity.", "A neutral mood because it facilitates a more detailed perception of the opportunity."], "c": 0, "neg": false, "e": "Positiver Affekt fördert eine globale Wahrnehmung ('Big Picture') und damit eine ganzheitliche Betrachtung der Gelegenheit (Baron, 2008).", "src": "S02 Folie 19", "origin": "Altklausur WS 2023/24, Frage 21", "also": ["WS 2022/23, Frage 7", "SS 2023, Frage 27"]},
{"id": "AK25S-02", "s": "S02", "q": "Affect shapes entrepreneurial cognition. According to the explanations in the lecture, if entrepreneurs are experiencing positive affect, how are they most likely to perceive the picture BELOW, and what are they most likely to see first and foremost?", "o": ["Global perception, triangles.", "Local perception, squares.", "Global perception, squares.", "Local perception, triangles."], "c": 0, "neg": false, "e": "Positiver Affekt löst globale Wahrnehmung aus: Man sieht zuerst das große Ganze, also die Dreiecke.", "src": "S02 Folie 19", "origin": "Altklausur SS 2025, Frage 2", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAACWCAMAAABAd1I9AAAAYFBMVEX///////3+/v79/f39/fv8/Pz8/Pv7+/v39/fy8vLs7Ozh4eHb29vX19fQ0NDFxcW1tbWqqqqVlZVqampdXV1BQUEuLi4cHBwPDw8KCgoICAgFBQUCAgIBAQEBAQAAAAAJPCPoAAAL+ElEQVR42u1cC5eiuBLOJDcTEEHwjZDL//+XW8/Emene4zJ4xHOsdnaNTeNnWal8qUeM+chHPvKR9Yqzhn7oAU/eAzShRsTOWvsmoBEtwbUC/y1Ae2t9+gBvA3pTbUCqqirc24Auz1eWS/MumI0pL+M0TTFOt515F9Rucx4R9TT1u7fRtGdNC+h30XR5QduIMaJ5vIumN5eJVB1B0/59NB3VPN7H5W3QPMA+phu4PPc2oMdhhMfQ78y6MVtmHUjtil27a/HRlkqZ7ErRAziedYg70DNnbOBfObNK1ETqiE0jYRJx+Bope50OmzEiPEfbAATpEni3zhlpnffhx88f4ef/4L8/xc4tf5pgwlo1vT0eT/ADUv0gi2iPInu/UodtbX2dZFHZ/qCX9jKeDtasVNOuvkaSqa/YgDsaxTge1rpZTJpG0PZ3Ta/Ve7gmmccfoN06YwmgyTub5o1tx2xvGg+4zqwSdFDQY9I0GjQazAFWGbvOwJKaR0ygYdtFU3GtoGHVa3pW9HSrjICeeLd4SIGQtYE21UFlwy5vp+MurG4ZR77BnMjq/9gYHMXzkIEEZ2yWdYSUvFGbzYjlV+zsMLznkfGtZmVEdUqElOmdlQCkZbpn3cq0LHPQMW92hN0pNqLYOiT0IawFdVE1dUNSeuLTm0akQrzOFLW+sFlNmH17uoi0rOgOn5/h5xAoWF0c0wWr8R7bS2R3PHZswR0FEHBRAcRgMcVJHPjYrQi0xO5uLVq1Q0pKK2M8yPb8xOxvnFalaVLtNHSUGnJdFI568ORLRNNw1Yo0fSZjmOLA5mEYdERKSt6uXKWmx2lAFtp3aA0eKOnA9O6AuS5nyhN9KLhiTaBZ0+PY0mriOk4EwESEqI1V80DG163Kpsdk04ASzSPyjgWph4COq7Lp+kJ6nOLY8mK+Z5c3TuTyPJgHfYYxTt0KQo68XJdtJ1IFXLR9pePG8mqTL9Ct2StB55CYclElTfeR1DvSml5fAZ+2Gb+O76OOme+9HHSGJCE7fZITzPmjMHWyv34zL2Gk8iQEm4sl7j5A/gyBUBeyPXDhZYl+W2xESsJk0nhTGMlzlfqCx41BSH9Qvixm0JzOIuQlvD/qeMd6rHR8hKgp2Eat49PLUrl2d+UI0jjsKK7hzspAW4a0HWSpP {"id": "AK25W-33", "s": "S02", "q": "An entrepreneur is in a very positive mood after receiving unexpected praise from a key customer. According to the lecture, how is she most likely to behave when discussing the latest product developments with her team now?", "o": ["She focuses on the technical details of the product because positive affect is associated with careful, detail-oriented information processing.", "She mainly recalls earlier problems and setbacks with the prototype because positive affect activates negative, risk-focused memories.", "She withdraws from her team and experiences less social support because positive affect typically reduces the activation of supportive networks.", "She focuses on the overall concept and relies more on heuristic processing because positive affect promotes global rather than detailed information processing."], "c": 3, "neg": false, "e": "Positiver Affekt führt zu globaler statt detaillierter Wahrnehmung und zu heuristischer Verarbeitung – sie fokussiert auf das Gesamtkonzept.", "src": "S02 Folie 19", "origin": "Altklausur WS 2025/26, Frage 33"},
{"id": "AK22W-16", "s": "S02", "q": "According to the lecture, which effect does the display of entrepreneurial passion have on the entrepreneur's stakeholders?", "o": ["It may limit how much feedback they provide.", "Especially investors value it over signals of competence.", "It is not important for employees.", "All of the above."], "c": 0, "neg": false, "e": "Zur Wirkung von Leidenschaft auf Stakeholder gehört laut Vorlesung, dass gezeigte Leidenschaft das Feedback einschränken kann ('Passion limits feedback').", "src": "S02 Folie 21", "origin": "Altklausur WS 2022/23, Frage 16"},
{"id": "AK25S-20", "s": "S02", "q": "According to the lecture, what is NOT true about obsessive passion in contrast to harmonious passion?", "o": ["It can help entrepreneurs to persist.", "It can become a trigger for burnout or depression in entrepreneurs.", "It helps entrepreneurs to feel good when they are working.", "It makes entrepreneurs feel bad when they are not working."], "c": 2, "neg": true, "e": "Ein gutes Gefühl beim Arbeiten kennzeichnet harmonische Leidenschaft; obsessive Leidenschaft kann zwar Ausdauer fördern, führt aber zu schlechtem Gefühl beim Nicht-Arbeiten und Burnout-Risiko.", "src": "S02 Folie 21", "origin": "Altklausur SS 2025, Frage 20"},
{"id": "AK26S-18", "s": "S02", "q": "Which of the following is true about entrepreneurs’ harmonious passion for their work?", "o": ["It can lead entrepreneurs to feel good when they are not working, hence creating negative outcomes for the entrepreneur personally.", "It can lead entrepreneurs to feel guilty when they are working, hence triggering negative outcomes for the venture.", "It can lead entrepreneurs to feel guilty when they are not working, hence creating positive outcomes for the entrepreneur personally.", "It can lead entrepreneurs to feel good when they are working, hence fostering positive outcomes for the venture."], "c": 3, "neg": false, "e": "Harmonische Leidenschaft bedeutet, sich beim Arbeiten gut zu fühlen – mit positiven Folgen für das Venture (und ohne Belastung durch Schuldgefühle).", "src": "S02 Folie 21", "origin": "Altklausur SS 2026, Frage 18"},
{"id": "AK26S-34", "s": "S02", "q": "Which of the following statements is NOT true about entrepreneurial passion according to the lecture?", "o": ["Passion can enhance entrepreneurs’ drive and persistence when engaging in challenging tasks.", "Obsessive passion can lead to psychological strain.", "Display of entrepreneurial passion ensures that all employees share the entrepreneur’s enthusiasm, independent of what specifically the entrepreneur is passionate about.", "Passion can help attract investors."], "c": 2, "neg": true, "e": "Leidenschaft wirkt auf Mitarbeitende nur positiv, wenn sie das Objekt der Leidenschaft teilen; sonst sind die Effekte negativ. Dass alle Mitarbeitenden die Begeisterung unabhängig vom Objekt teilen, ist falsch.", "src": "S02 Folie 21", "origin": "Altklausur SS 2026, Frage 34"},
{"id": "SK-03", "s": "S02", "q": "Which statement is WRONG about entrepreneurial passion?", "o": ["Professional investors tend to prefer entrepreneurs’ preparedness compared to their passion.", "Entrepreneurs tend to attract stakeholders, such as employees, based on their passion.", "Highlighting an entrepreneurs’ passion might reduce the feedback that this entrepreneur will receive from stakeholders.", "Obsessive passion tends to have positive consequences for entrepreneurial well-being."], "c": 3, "neg": true, "e": "Die Folie unterscheidet harmonische und obsessive Passion und betont: „passion can be a burden!“ – obsessive Passion wirkt eher negativ auf das Wohlbefinden. Zutreffend sind dagegen: Investoren gewichten Kompetenzsignale höher als Passion, Passion zieht Stakeholder an und „passion limits feedback“.", "src": "S02 Folie 21 (Cardon et al., 2009; Chen et al., 2009; Breugst et al., 2012)", "origin": "Beispielfrage Skript S03 Folie 5"},
{"id": "AK23W-22", "s": "S03", "q": "In a video presented in the lecture, Melanie Perkins, the founder of Canva, speaks about how she recognized the opportunity for creating Canva. Which factors were discussed that may have inspired her ability to recognize this opportunity?", "o": ["Her knowledge of design software and her insights into the market.", "Her prior work as an influencer and her network of content creators.", "Her work experience at a big company and the complaints by their customers.", "Her knowledge of app development and her artistic interest."], "c": 0, "neg": false, "e": "Melanie Perkins kannte sich durch das Unterrichten von Designprogrammen mit Designsoftware aus und hatte Einblicke in den Markt (Studierende fanden die Tools zu kompliziert).", "src": "S03 Folie 8 (Video Canva)", "origin": "Altklausur WS 2023/24, Frage 22"},
{"id": "AK24S-19", "s": "S03", "q": "When Melanie Perkins was in university, she taught design programs like Photoshop and InDesign. Later on, she founded Canva. According to the model of opportunity identification presented in the lecture, which statement is most likely to be true?", "o": ["The entrepreneur’s prior knowledge influenced her opportunity identification.", "The entrepreneur's network influenced her opportunity identification.", "Regulatory changes influenced the entrepreneur's opportunity identification.", "The entrepreneur’s opportunity identification was a pure coincidence."], "c": 0, "neg": false, "e": "Melanie Perkins brachte durch ihr Unterrichten von Designprogrammen Vorwissen mit, das ihre Gelegenheitserkennung (Canva) prägte.", "src": "S03 Folie 8, 13–14", "origin": "Altklausur SS 2024, Frage 19"},
{"id": "AK23S-12", "s": "S03", "q": "According to the lecture, which factors contribute directly to opportunity identification?", "o": ["Knowledge, networks, and creativity.", "Creativity, knowledge, and socio-economic status.", "Personal income, networks, and knowledge.", "Changes in the environment, creativity, and technical skills."], "c": 0, "neg": false, "e": "Nach George et al. (2016) (S03 Folie 9) wirken Wissen, Netzwerke und Kreativität direkt auf die Gelegenheitserkennung; Umweltveränderungen bilden den Rahmen darunter. Sozioökonomischer Status, Einkommen oder technische Fähigkeiten gehören nicht zu den genannten Faktoren.", "src": "S03 Folie 9", "origin": "Altklausur SS 2023, Frage 12"},
{"id": "SK-04", "s": "S03", "q": "An entrepreneur worked as a designer and gets to know the three-dimensional printing technology. After talking to a friend who works as a surgeon the entrepreneur starts a company that produces bone replacement materials.", "o": ["The entrepreneur’s opportunity recognition was probably influenced by his network which frequently happens.", "The entrepreneur’s opportunity recognition was probably influenced by his network which rarely happens.", "The entrepreneur’s opportunity recognition was probably influenced by his previous experience which rarely happens.", "The entrepreneur’s opportunity recognition was probably a pure coincidence."], "c": 0, "neg": false, "e": "Die Idee (Knochenersatz) stammt nicht aus der Designer-Erfahrung, sondern aus dem Gespräch mit dem befreundeten Chirurgen – also aus dem sozialen Netzwerk. Laut Hills et al. (2004) entstehen Ideen sehr häufig über Netzwerke (z. B. Freunde & Familie), und Vorwissen beeinflusst die Opportunity Recognition stark, ist also weder selten noch reiner Zufall.", "src": "S03 Folien 9–19 (Shane, 2000; Hills et al., 2004; George et al., 2016)", "origin": "Beispielfrage Skript S04 Folie 3"},
{"id": "AK22W-01", "s": "S03", "q": "Which of the following conclusions can NOT be deducted from the example of the 3-D printing technology as presented in class?", "o": ["Knowledge and experience are important for opportunity identification.", "Products based on one technology developed by different teams are similar.", "Technologies developed without a clear target market can still be successfully commercialized.", "Several companies can be founded using the same basic technology."], "c": 1, "neg": true, "e": "Das 3D-Druck-Beispiel (Shane, 2000) zeigt gerade, dass Teams mit unterschiedlichem Vorwissen aus derselben Technologie ganz verschiedene Produkte/Gründungen entwickelten (Medikamente, Designermodelle, Skulpturen). Dass die Produkte ähnlich seien, lässt sich daraus also nicht ableiten.", "src": "S03 Folie 10–14", "origin": "Altklausur WS 2022/23, Frage 1"},
{"id": "AK24S-16", "s": "S03", "q": "Our guest, Johannes Kurtz from Excellion, mentioned different markets that they explored for their product. This is an example of …", "o": ["the versatility of a technology.", "the predictability of the entrepreneurial process.", "a multi-sided platform.", "a scaling strategy."], "c": 0, "neg": false, "e": "Dass Excellion verschiedene Märkte für sein Produkt erkundete, zeigt die Vielseitigkeit (Versatility) einer Technologie – wie beim 3D-Druck-Beispiel.", "src": "S03 Folie 10–15", "origin": "Altklausur SS 2024, Frage 16", "also": ["WS 2023/24, Frage 19"]},
{"id": "AK24W-27", "s": "S03", "q": "What factors shape whether or not people are able to identify an opportunity?", "o": ["The financial resources available to the individuals at the time.", "Individuals' prior knowledge and experiences.", "The level of competition in the market.", "The individual's access to a specific technology."], "c": 1, "neg": false, "e": "Ob jemand eine Gelegenheit erkennt, hängt vor allem von Vorwissen und Erfahrungen ab (Shane, 2000).", "src": "S03 Folie 13–14", "origin": "Altklausur WS 2024/25, Frage 27"},
{"id": "AK25S-35", "s": "S03", "q": "After learning about the three-dimensional printing technology, a trained surgeon starts a company that produces bone replacement materials. If you follow the model of opportunity identification presented in the lecture, which statement is most likely to be true?", "o": ["The entrepreneur’s opportunity identification is influenced by her prior knowledge.", "The entrepreneur’s opportunity identification is influenced by her network.", "The entrepreneur’s opportunity identification is influenced by regulatory changes.", "The entrepreneur’s opportunity identification is a pure coincidence."], "c": 0, "neg": false, "e": "Die Chirurgin erkennt die Gelegenheit (Knochenersatz) aufgrund ihres medizinischen Vorwissens – Vorwissen bestimmt, welche Gelegenheit aus einer Technologie erkannt wird (Shane, 2000).", "src": "S03 Folie 13–14", "origin": "Altklausur SS 2025, Frage 35", "also": ["WS 2023/24, Frage 9", "WS 2024/25, Frage 11"]},
{"id": "AK23S-19", "s": "S03", "q": "Social networks play an important role in entrepreneurship. According to Davidsson and Honig (2003), which of the following circumstances has the highest impact on an entrepreneur's success?", "o": ["Being a member of a business network.", "Being encouraged by friends.", "Having parents in business.", "Having friends in business."], "c": 0, "neg": false, "e": "Davidsson & Honig (2003) fanden, dass die Mitgliedschaft in einem Business-Netzwerk den stärksten Effekt auf den Gründungserfolg hat.", "src": "S03 Folie 19", "origin": "Altklausur SS 2023, Frage 19", "also": ["WS 2022/23, Frage 17"]},
{"id": "AK24S-35", "s": "S03", "q": "Founders from different companies providing each other advice on how to scale their businesses is an example of …", "o": ["Instrumental support from social networks", "Informational support from social networks", "Appraisal support from social networks", "Emotional support from social networks"], "c": 1, "neg": false, "e": "Ratschläge und Informationen von anderen Gründern sind informationelle Unterstützung (typisch für schwache Bindungen).", "src": "S03 Folie 19", "origin": "Altklausur SS 2024, Frage 35", "also": ["WS 2023/24, Frage 20"]},
{"id": "AK25W-11", "s": "S03", "q": "Which statement correctly matches a type of social support with its description?", "o": ["Informational support involves providing actionable advice or expertise", "Instrumental support consists of providing encouragement during setbacks.", "Emotional support refers to offering tools or physical resources.", "Appraisal support refers to sharing contacts and introductions."], "c": 0, "neg": false, "e": "Informationelle Unterstützung besteht aus Rat, Vorschlägen und Informationen bzw. Expertise.", "src": "S03 Folie 19", "origin": "Altklausur WS 2025/26, Frage 11"},
{"id": "AK26S-15", "s": "S03", "q": "What does the case on Sony’s CD development process we discussed in the lecture illustrate?", "o": ["It illustrates that firms should base new product designs on established market standards to reduce uncertainty.", "Prior knowledge can constrain opportunity identification because existing mental models limit how individuals imagine new solutions.", "It shows that new technologies naturally find their best application without the need for creative thinking.", "It demonstrates that most missed opportunities result from a lack of financial or technical resources."], "c": 1, "neg": false, "e": "Sonys Fall zeigt: Vorwissen kann eine Last sein, weil bestehende mentale Modelle (z. B. Vinyl-Länge) einschränken, wie man sich neue Lösungen vorstellt.", "src": "S03 Folie 21", "origin": "Altklausur SS 2026, Frage 15"},
{"id": "AK22W-35", "s": "S03", "q": "What is true about creativity?", "o": ["Creativity refers to convergent thinking, i.e., intuition, gut feeling, and irrationality.", "Creativity refers to divergent thinking, i.e., logic, previous knowledge, and rationality.", "Creativity refers to both, convergent and divergent thinking.", "None of the above."], "c": 2, "neg": false, "e": "Kreativität umfasst sowohl konvergentes als auch divergentes Denken – also Logik, Vorwissen und Rationalität ebenso wie Intuition, Bauchgefühl und Irrationalität.", "src": "S03 Folie 23", "origin": "Altklausur WS 2022/23, Frage 35"},
{"id": "AK23W-18", "s": "S03", "q": "What is true about creativity?", "o": ["Creativity involves convergent thinking, i.e., intuition, gut feeling, and irrationality.", "Creativity involves divergent thinking, i.e., logic, previous knowledge, and rationality.", "Creativity involves both, convergent and divergent thinking.", "Creativity mainly involves divergent thinking."], "c": 2, "neg": false, "e": "Kreativität umfasst konvergentes und divergentes Denken – Logik, Vorwissen und Rationalität ebenso wie Intuition und Irrationalität.", "src": "S03 Folie 23", "origin": "Altklausur WS 2023/24, Frage 18"},
{"id": "AK25W-08", "s": "S03", "q": "Creativity is central to the entrepreneurial process. What is NOT true about creativity?", "o": ["Creativity can involve rationality and irrationality.", "Creativity is innate and cannot be trained.", "Creativity means the generation of novel as well as potentially useful ideas, insights, and problem solutions.", "Creativity can be reactive and proactive."], "c": 1, "neg": true, "e": "Kreativität kann trainiert und durch Techniken (konzeptionelle Kombination, Analogien, Checkliste) gefördert werden – sie ist nicht angeboren und untrainierbar.", "src": "S03 Folie 23", "origin": "Altklausur WS 2025/26, Frage 8"},
{"id": "AK22W-21", "s": "S03", "q": "What is true about the creativity technique \"conceptual combination\"?", "o": ["It describes the process of generating novel ideas by mentally combining different, previously unrelated concepts.", "Results may address different needs of different customer groups, as opposed to an already existing idea.", "Examples include \"glamping\" or \"healthy fast food\"", "All of the above."], "c": 3, "neg": false, "e": "Konzeptionelle Kombination verbindet bisher unverbundene Konzepte zu neuen Ideen (z. B. Glamping, Healthy Fast Food) und kann unterschiedliche Bedürfnisse verschiedener Kundengruppen adressieren – alle Aussagen stimmen.", "src": "S03 Folie 24", "origin": "Altklausur WS 2022/23, Frage 21"},
{"id": "AK23S-33", "s": "S03", "q": "When different target groups have apparently contradicting needs, these needs might be combined to generate new ideas or products. Which creativity technique works based on this principle?", "o": ["Analogical reasoning.", "Conceptual combination.", "The checklist method.", "Closing the difference gap."], "c": 1, "neg": false, "e": "Bei der konzeptionellen Kombination werden scheinbar widersprüchliche Bedürfnisse unterschiedlicher Zielgruppen zu neuen Ideen kombiniert (z. B. Healthy Fast Food, Affordable Luxury).", "src": "S03 Folie 24", "origin": "Altklausur SS 2023, Frage 33"},
{"id": "AK24S-23", "s": "S03", "q": "Consider the design of road reflectors inspired by the high visibility of cat eyes in the dark. Which creativity technique might have influenced their design?", "o": ["Analogical reasoning.", "Conceptual combination.", "The checklist method.", "Closing the difference gap."], "c": 0, "neg": false, "e": "Katzenaugen als Vorbild für Reflektoren: Wissen aus einer Domäne (Natur) wird auf eine andere übertragen – das ist analoges Denken.", "src": "S03 Folie 26", "origin": "Altklausur SS 2024, Frage 23"},
{"id": "AK24W-28", "s": "S03", "q": "Trying to solve a problem by copying the way geckos (small reptiles) climb walls like \"Spiderman\" is an example of which creativity technique?", "o": ["Conceptual Combination.", "Analogical Reasoning.", "Checklist Method.", "None of the above."], "c": 1, "neg": false, "e": "Das Klettern von Geckos zu kopieren, überträgt ein Prinzip aus der Natur auf ein technisches Problem – analoges Denken.", "src": "S03 Folie 26", "origin": "Altklausur WS 2024/25, Frage 28"},
{"id": "AK26S-05", "s": "S03", "q": "An entrepreneur designing a warehouse robot examines how bees coordinate movement inside a hive and applies the same principles to optimize robot communication. Which creativity technique does this example most closely reflect?", "o": ["Morphological Analysis, because she might explore new design options by varying different robot attributes and combining them in new ways.", "Checklist Method, because she could systematically improve the design by asking structured prompts such as “modify,” “adapt,” or “rearrange.”", "Conceptual Combination, because she blends different concepts to create a new idea, such as combining unrelated product features or customer needs.", "Analogical Reasoning, because she transfers a principle from one domain (bee behavior) to another (robot communication)."], "c": 3, "neg": false, "e": "Das Prinzip der Bienenkoordination wird auf die Roboterkommunikation übertragen – Wissen aus einer Domäne in eine andere: analoges Denken.", "src": "S03 Folie 26", "origin": "Altklausur SS 2026, Frage 5"},
{"id": "AK24S-15", "s": "S03", "q": "Which analytical framework describes categories of environmental changes?", "o": ["Effectuation framework.", "BATNA analysis.", "Ansoff matrix.", "PEST framework."], "c": 3, "neg": false, "e": "Das PEST-Framework beschreibt politische, ökonomische, soziale und technologische Umweltveränderungen als Quellen von Gelegenheiten.", "src": "S03 Folie 29–30", "origin": "Altklausur SS 2024, Frage 15"},
{"id": "AK25W-02", "s": "S03", "q": "Imagine you are an entrepreneurial manager at a German mid-sized baby food producer: Which change(s) in the environment might be an opportunity for you?", "o": ["Aging population in Western countries with a higher need for easily digestible food.", "All of the answer options provided.", "Chemicals found in baby food in other countries on a regular basis.", "Globally growing middle class including parents who want the best for their children."], "c": 1, "neg": false, "e": "Alle genannten Umweltveränderungen (alternde Bevölkerung, Chemikalien in ausländischer Babynahrung, wachsende Mittelschicht) können Gelegenheiten für einen Babynahrungshersteller sein.", "src": "S03 Folie 29–30 (PEST)", "origin": "Altklausur WS 2025/26, Frage 2", "also": ["SS 2023, Frage 9"]},
{"id": "AK26S-07", "s": "S03", "q": "What does the PEST framework we discussed in the lecture highlight about the origin of entrepreneurial opportunities?", "o": ["Opportunities appear only when technological development reaches a certain threshold.", "Opportunities form gradually in response to environmental changes.", "Opportunities arise when changes in political, economic, societal, or technological conditions converge in new ways.", "Opportunities depend on harsh market competition levels."], "c": 2, "neg": false, "e": "Nach Baron (2006) entstehen Gelegenheiten aus einem komplexen Muster sich verändernder politischer, ökonomischer, sozialer und technologischer Bedingungen, die neu zusammentreffen.", "src": "S03 Folie 29", "origin": "Altklausur SS 2026, Frage 7"},
{"id": "AK25S-18", "s": "S04", "q": "Entrepreneurs must often make decisions under conditions of risk. What is true about risk?", "o": ["The probability of an outcome is not possible to determine or is unknowable.", "It is an antonym of uncertainty.", "Conditions of uncertainty and conditions of risk bear fundamentally different challenges for entrepreneurs.", "Need for risk-taking is an important entrepreneurial motive."], "c": 2, "neg": false, "e": "Risiko (Wahrscheinlichkeiten bekannt) und Unsicherheit (unbekannt) stellen grundsätzlich unterschiedliche Herausforderungen dar.", "src": "S04 Folie 7–8", "origin": "Altklausur SS 2025, Frage 18", "also": ["WS 2023/24, Frage 17"]},
{"id": "AK22W-26", "s": "S04", "q": "Entrepreneurs often must make decisions under conditions of risk. What is true about risk?", "o": ["The probability of an outcome is possible to calculate or is knowable.", "It is a synonym for uncertainty.", "Under risk, it is not possible to determine the probability of an outcome.", "Need for risk-taking is an important entrepreneurial motive."], "c": 0, "neg": false, "e": "Unter Risiko ist die Wahrscheinlichkeit eines Ergebnisses berechenbar bzw. bekannt (Knight, 1921); unter Unsicherheit dagegen nicht.", "src": "S04 Folie 8", "origin": "Altklausur WS 2022/23, Frage 26"},
{"id": "AK23S-30", "s": "S04", "q": "How is uncertainty defined according to Knight (1921)?", "o": ["The probability of an outcome is possible to calculate or is knowable.", "The probability of an outcome is not possible to determine or is unknowable.", "Uncertainty requires entrepreneurs to change their opportunity.", "None of the above are correct."], "c": 1, "neg": false, "e": "Nach Knight (1921) liegt Unsicherheit vor, wenn die Wahrscheinlichkeit eines Ergebnisses nicht bestimmbar bzw. unbekannt ist.", "src": "S04 Folie 8", "origin": "Altklausur SS 2023, Frage 30"},
{"id": "AK26S-02", "s": "S04", "q": "In opportunity development, what characterizes the shift from uncertainty to risk?", "o": ["Known outcomes are evaluated based on their business potential.", "Unknown outcomes become predictable enough that probabilities can be assessed.", "None of the options is correct.", "The range of possible outcomes is reduced based on expert advice."], "c": 1, "neg": false, "e": "Von Unsicherheit zu Risiko kommt man, wenn unbekannte Ergebnisse so vorhersehbar werden, dass sich Wahrscheinlichkeiten abschätzen lassen (Knight).", "src": "S04 Folie 8, 10", "origin": "Altklausur SS 2026, Frage 2", "also": ["WS 2025/26, Frage 5"]},
{"id": "AK24S-13", "s": "S04", "q": "The process of developing a business opportunity can involve", "o": ["coming to an inspiring and stable vision of the young venture.", "sticking to the initial business idea in order to reduce uncertainty.", "concealing the idea from other people.", "gradually reducing the uncertainty surrounding the business idea."], "c": 3, "neg": false, "e": "Opportunity Development ist ein kontinuierlicher Prozess, in dem die Unsicherheit rund um die Geschäftsidee schrittweise reduziert wird.", "src": "S04 Folie 10", "origin": "Altklausur SS 2024, Frage 13"},
{"id": "AK24S-29", "s": "S04", "q": "Which opportunity development activities are related to venture performance or growth according to the lecture?", "o": ["The process of writing a business plan, but not the existence of a business plan per se.", "Having a business plan, but not the process of writing a business plan.", "Business planning does not contribute to venture performance.", "The process of writing a business plan as well as the existence of a business plan."], "c": 3, "neg": false, "e": "Laut Vorlesung (Brinckmann et al., 2010) hängen sowohl der Prozess der Businessplanung als auch das Vorhandensein eines Businessplans positiv mit Performance/Wachstum zusammen.", "src": "S04 Folie 11", "origin": "Altklausur SS 2024, Frage 29"},
{"id": "AK23W-30", "s": "S04", "q": "Which principle is absent to transform the following into a SMART goal: \"Develop and launch a mobile application that provides personalized fitness plans for busy professionals, with the goal of achieving 10,000 downloads, in response to the growing demand for convenient fitness solutions in the market.\"", "o": ["Specific.", "Measurable.", "Restricted.", "Time-bound."], "c": 3, "neg": false, "e": "Specific, Measurable (10.000 Downloads), Relevant sind enthalten, aber es fehlt eine Frist – das Ziel ist nicht time-bound.", "src": "S04 Folie 12", "origin": "Altklausur WS 2023/24, Frage 30"},
{"id": "AK24S-20", "s": "S04", "q": "Which principle is absent to transform the following into a SMART goal: \"Develop and launch a mobile application that provides personalized fitness plans for busy professionals, with the goal of achieving 10,000 downloads, in response to the growing demand for convenient fitness solutions in the market.\"", "o": ["Specific", "Measurable", "Relevant", "Time-bound"], "c": 3, "neg": false, "e": "Das Ziel ist spezifisch, messbar (10.000 Downloads) und relevant, aber es fehlt eine Frist – also nicht time-bound.", "src": "S04 Folie 12", "origin": "Altklausur SS 2024, Frage 20"},
{"id": "AK26S-21", "s": "S04", "q": "To achieve high performance, entrepreneurial managers are advised to set SMART goals. SMART goals are goals that are:", "o": ["Special, meaningful, actual, robust, trustworthy.", "Special, maximizing, action-oriented, revolutionary, transformable.", "Specific, mindful, active, real, task-oriented.", "Specific, measurable, achievable, relevant, time-bound."], "c": 3, "neg": false, "e": "SMART: Specific, Measurable, Achievable, Relevant, Time-bound (Doran, 1981).", "src": "S04 Folie 12", "origin": "Altklausur SS 2026, Frage 21"},
{"id": "AK25S-23", "s": "S04", "q": "What is NOT part of the effectuation framework?", "o": ["Iterate and Adapt.", "Leverage Surprise.", "Form Partnerships.", "Start with your Resources."], "c": 0, "neg": true, "e": "Effectuation hat vier Prinzipien: Start with your resources, Affordable loss, Form partnerships, Leverage surprise. 'Iterate and Adapt' gehört nicht dazu.", "src": "S04 Folie 17", "origin": "Altklausur SS 2025, Frage 23", "also": ["WS 2024/25, Frage 10"]},
{"id": "AK22W-13", "s": "S04", "q": "Which actions are typical of an entrepreneur who starts a new restaurant and follows the effectuation process?", "o": ["Identifying a suitable location by analyzing the competitor landscape in the neighborhood.", "Thorough analysis and evaluation of market segments.", "Watching out for opportunities that fit own resources.", "Design of appropriate marketing strategies to tackle the target customer group."], "c": 2, "neg": false, "e": "Effectuation heißt: von vorhandenen Mitteln ausgehen und nach Gelegenheiten Ausschau halten, die zu diesen Ressourcen passen. Markt-/Segmentanalysen und Marketingstrategien sind Causation.", "src": "S04 Folie 18–19; S07 Folie 5 (Gedankenexperiment Pasta)", "origin": "Altklausur WS 2022/23, Frage 13"},
{"id": "AK23S-31", "s": "S04", "q": "An entrepreneur who is visually impaired realizes he has a different approach to food and tasting compared to all his friends who are able to see. He is convinced that our senses of smelling and tasting are sharpened if we are unable to see. Based on this observation, he starts a restaurant offering a \"dining in the dark\" experience, i.e., his customers eat in a restaurant without any light coming in. Which principle of effectuation offers the best explanation for this story?", "o": ["Start with your means.", "Affordable loss.", "Form partnerships.", "Leverage surprise."], "c": 0, "neg": false, "e": "Der Gründer nutzt seine eigene Identität und Erfahrung (Sehbehinderung, geschärfte Sinne) als Ausgangspunkt – das ist 'Start with your means' (Who I am, What I know).", "src": "S04 Folie 18–20", "origin": "Altklausur SS 2023, Frage 31"},
{"id": "AK23W-12", "s": "S04", "q": "According to Sarasvathy (2001), what is true about causation processes?", "o": ["They allow entrepreneurs to focus on a goal.", "They allow entrepreneurs to exploit contingencies.", "They can facilitate the creation of new markets through alliances.", "They allow entrepreneurs to focus on the controllable aspects of an unpredictable future"], "c": 0, "neg": false, "e": "Causation startet mit einem gewünschten Ergebnis (Ziel) und sucht die Mittel dazu – erlaubt also den Fokus auf ein Ziel.", "src": "S04 Folie 18", "origin": "Altklausur WS 2023/24, Frage 12"},
{"id": "AK24S-14", "s": "S04", "q": "What characterizes effectual decision makers?", "o": ["They think in terms of resources, not in terms of uncertainty.", "They emphasize planning over experimentation.", "They set up transactional relationships with customers and suppliers.", "All of the above."], "c": 0, "neg": false, "e": "Laut Schlüssel denken effektuale Entscheider in Ressourcen (Mitteln) statt in Unsicherheit. Planung vor Experimenten und transaktionale Beziehungen kennzeichnen dagegen Causation.", "src": "S04 Folie 18, 23", "origin": "Altklausur SS 2024, Frage 14"},
{"id": "AK26S-09", "s": "S04", "q": "Which approach aligns most closely with the principle of effectuation?", "o": ["Preparing ingredients in line with an existing recipe.", "Improvising and creatively using available ingredients to prepare a dish.", "None of the above are correct.", "Looking up recipes online before going to the supermarket."], "c": 1, "neg": false, "e": "Effectuation heißt: von den verfügbaren Mitteln ausgehen – wie ein Koch, der improvisiert und mit vorhandenen Zutaten kreativ ein Gericht zubereitet.", "src": "S04 Folie 18; S07 Folie 3", "origin": "Altklausur SS 2026, Frage 9", "also": ["WS 2023/24, Frage 27"]},
{"id": "AK22W-28", "s": "S04", "q": "Our Guest Speaker Jörg-Michael Weber (co-founder of ATLAS) shared that he and his co-founder always try to buy used lab equipment (e.g. from eBay Kleinanzeigen) instead of brand new equipment. Which principle could best describe this behavior?", "o": ["The start with your resources principle.", "The form partnerships principle.", "The affordable loss principle.", "The problem minimization principle."], "c": 2, "neg": false, "e": "Gebrauchtes statt neues Laborequipment zu kaufen begrenzt Investitionen und Kosten – das entspricht dem Affordable-loss-Prinzip ('risk little, fail cheap').", "src": "S04 Folie 21–22", "origin": "Altklausur WS 2022/23, Frage 28"},
{"id": "AK24S-05", "s": "S04", "q": "Our guest, Johannes Kurtz from Excellion, described that the team of Excellion bought used equipment from classified ads portals (e.g. Kleinanzeigen), financed product development through grants, and relied on working students instead of space engineers demanding high salaries. These behaviors are consistent with one principle from the effectuation framework that we discussed in the lecture. Which principle describes these behaviors best?", "o": ["Start with your resources principle", "Affordable loss principle", "Form partnerships principles", "Leverage surprise principles"], "c": 1, "neg": false, "e": "Gebrauchtes Equipment, Förderung über Grants und Werkstudierende statt teurer Ingenieure begrenzen Investitionen und Kosten – das ist das Affordable-loss-Prinzip.", "src": "S04 Folie 21–22", "origin": "Altklausur SS 2024, Frage 5"},
{"id": "SK-05", "s": "S04", "q": "Considering the effectuation framework (Sarasvathy, 2001) and according to the explanations in the lecture, the recent trend of upcycling is consistent with the…", "o": ["...start with your resources principle.", "...affordable loss principle.", "...form partnerships principle.", "...leverage surprise principle."], "c": 1, "neg": false, "e": "Die Folie zum Affordable-Loss-Prinzip („Risk little, fail cheap“) nennt die Nutzung flexibler bzw. günstiger oder kostenloser Ressourcen und dass das Prinzip Ausgangspunkt für nachhaltiges Business sein kann – illustriert mit ChopValue (Möbel aus gebrauchten Essstäbchen). Upcycling passt daher zum Affordable-Loss-Prinzip.", "src": "S04 Folien 21–22 (Sarasvathy, 2001)", "origin": "Beispielfrage Skript S07 Folie 6", "also": ["WS 2024/25, Frage 16", "SS 2025, Frage 12"]},
{"id": "AK24W-09", "s": "S04", "q": "What is true when it comes to forming partnerships in the context of effectuation?", "o": ["Each stakeholder can bring new means to the venture.", "Each stakeholder invests all their assets.", "A partnership offers an environment with expectable contingencies.", "Partnerships are only valuable to large corporate companies."], "c": 0, "neg": false, "e": "Im Effectuation-Prinzip 'Form partnerships' kann jeder Stakeholder neue Mittel in das Venture einbringen und so die Ressourcenbasis erweitern.", "src": "S04 Folie 23, 27", "origin": "Altklausur WS 2024/25, Frage 9"},
{"id": "AK25W-13", "s": "S04", "q": "During a market test, a startup discovers that customers are using its product for a completely different purpose than originally intended. Which reaction is most consistent with the effectuation logic discussed in the lecture?", "o": ["Prioritizing internal product development goals to avoid diluting the original idea too early in the process.", "Evaluating whether the unexpected use aligns with the long-term strategic vision before deciding whether to incorporate it.", "Exploring the unexpected use further and considering how the venture could be redirected to build on this new demand.", "Pausing all activities until more data is available to confirm the original assumptions."], "c": 2, "neg": false, "e": "Effectuation nutzt Überraschungen (Leverage surprise): Die unerwartete Nutzung wird erkundet und das Venture ggf. neu ausgerichtet.", "src": "S04 Folie 25–26", "origin": "Altklausur WS 2025/26, Frage 13"},
