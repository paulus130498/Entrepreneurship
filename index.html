/* ---------- Speicher ---------- */
const KEY = "eship-ak-trainer-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { store = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
const status = id => store[id] || "open";

/* ---------- Hilfen ---------- */
const $ = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const qOf = sid => QUESTIONS.filter(q => q.s === sid);
const sess = sid => SESSIONS.find(s => s.id === sid);
const idLabel = s => s.id === "SX" ? "–" : s.id;
const crumbLabel = s => s.id === "SX" ? "Ohne Vorlesungsbezug" : s.id;
const isExam = q => /^Altklausur/.test(q.origin || "");
function countsOf(sid){ const c = {right:0, wrong:0, open:0}; qOf(sid).forEach(q => c[status(q.id)]++); return c; }
function qText(q){
  const p = $("p","qtext");
  q.q.split(/\b(WRONG|NOT|FALSE)\b/).forEach((part,i) => { if (i % 2) p.appendChild($("em",null,part)); else p.appendChild(document.createTextNode(part)); });
  return p;
}
function bar(c, total){
  const b = $("div","bar"); b.setAttribute("role","img");
  b.setAttribute("aria-label", `${c.right} richtig, ${c.wrong} falsch, ${c.open} offen`);
  [["right","--right-bar"],["wrong","--wrong"]].forEach(([k,v]) => { const i = $("i"); i.style.width = (c[k]/total*100)+"%"; i.style.background = `var(${v})`; b.appendChild(i); });
  return b;
}
function crumbs(items){
  const c = $("div","crumbs");
  items.forEach((it,i) => {
    if (i) c.appendChild($("span","sep","›"));
    if (it.go){ const b = $("button",null,it.label); b.onclick = it.go; c.appendChild(b); } else c.appendChild($("span",null,it.label));
  });
  return c;
}

/* ---------- Abbildung vergrößern ---------- */
const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lbImg"), lbClose = document.getElementById("lbClose");
let lbReturn = null;
function openLightbox(src, alt, from){
  lbImg.src = src; lbImg.alt = alt || "";
  lbReturn = from || null;
  lb.hidden = false; document.documentElement.classList.add("lb-open");
  lbClose.focus();
}
function closeLightbox(){
  if (lb.hidden) return;
  lb.hidden = true; document.documentElement.classList.remove("lb-open");
  lbImg.removeAttribute("src");
  if (lbReturn && document.contains(lbReturn)) lbReturn.focus();
  lbReturn = null;
}
lbClose.onclick = closeLightbox;
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape"){ e.preventDefault(); closeLightbox(); }
  else if (e.key === "Tab"){ e.preventDefault(); lbClose.focus(); }
});

/* ---------- Zustand ---------- */
const page = document.getElementById("page"), nav = document.getElementById("nav"), main = document.getElementById("main"), aside = document.getElementById("aside");
let current = (SESSIONS.find(s => qOf(s.id).length) || SESSIONS[0]).id;
let run = null;

function renderNav(){
  nav.replaceChildren($("div","navhead","Sessions"));
  SESSIONS.forEach(s => {
    const n = qOf(s.id).length;
    const b = $("button", (s.id === current ? "active " : "") + (n ? "" : "locked"));
    b.append($("span",null,s.title), $("span","id", idLabel(s)));
    b.onclick = () => { current = s.id; run = null; renderHome(); window.scrollTo({top:0}); };
    nav.appendChild(b);
  });
}
function renderAside(){
  aside.replaceChildren($("h2",null,"So funktioniert’s"));
  aside.appendChild($("p",null,"Enthält nur Originalfragen aus früheren Klausuren und die Beispielfragen von Prof. Breugst aus den Folien, sortiert nach Vorlesung."));
  aside.appendChild($("p",null,"Vier Antworten, genau eine ist richtig. Die Reihenfolge wird jedes Mal neu gemischt."));
  aside.appendChild($("p",null,"Falsch beantwortete Fragen kommen nach spätestens drei anderen Fragen wieder, bis sie richtig sind."));
  const lg = $("div","legend");
  [["--right-bar","richtig beantwortet"],["--wrong","falsch beantwortet"],["--open","noch offen"]].forEach(([v,t]) => { const s = $("span"); const d = $("i","dot"); d.style.background = `var(${v})`; s.append(d, t); lg.appendChild(s); });
  aside.appendChild(lg);
  aside.appendChild($("p",null,"Fragen auf Englisch wie in der Klausur, Erklärungen auf Deutsch."));
}

/* ---------- Session-Übersicht ---------- */
function renderHome(confirm){
  closeLightbox();
  page.classList.remove("quizmode");
  renderNav(); renderAside();
  const s = sess(current), qs = qOf(current);
  main.replaceChildren(crumbs([{label:"Altklausuren"},{label: s.date ? `${crumbLabel(s)} · ${s.date}` : crumbLabel(s)}]));
  main.appendChild($("h1","title",s.title));
  if (!qs.length){
    main.appendChild($("p","lead","Zu dieser Session gibt es keine Fragen aus Altklausuren oder Beispielfragen im Skript."));
    return;
  }
  const c = countsOf(current), todo = c.open + c.wrong;
  const ov = $("section","overview");
  const nAk = qs.filter(isExam).length, nSk = qs.length - nAk;
  const parts = [];
  if (nAk) parts.push(`${nAk} aus Altklausuren`);
  if (nSk) parts.push(`${nSk} ${nSk === 1 ? "Beispielfrage" : "Beispielfragen"} aus dem Skript`);
  ov.appendChild($("p","lead", `${qs.length} ${qs.length === 1 ? "Frage" : "Fragen"}: ${parts.join(", ")}.`));
  ov.appendChild(bar(c, qs.length));
  const counts = $("div","counts");
  [["c-right","richtig","right"],["c-wrong","falsch","wrong"],["c-open","offen","open"]].forEach(([cl,t,k]) => { const sp = $("span",cl); sp.append($("b",null,String(c[k]))," "+t); counts.appendChild(sp); });
  ov.appendChild(counts);
  const act = $("div","actions");
  const go = $("button","btn primary", todo === qs.length ? "Starten" : todo ? `Weiterlernen (${todo})` : "Alles richtig ✓");
  go.disabled = !todo; go.onclick = () => startRun(current, "todo");
  act.appendChild(go);
  if (c.wrong){ const w = $("button","btn", `Nur falsche (${c.wrong})`); w.onclick = () => startRun(current, "wrong"); act.appendChild(w); }
  if (c.right || c.wrong){ const r = $("button","btn ghost","Zurücksetzen"); r.onclick = () => renderHome(true); act.appendChild(r); }
  ov.appendChild(act);
  if (confirm){
    const cf = $("div","confirm"); cf.appendChild($("span",null,`Fortschritt für ${s.id} löschen?`));
    const y = $("button","btn","Ja, löschen"); y.onclick = () => { qs.forEach(q => delete store[q.id]); save(); renderHome(); };
    const n = $("button","btn ghost","Abbrechen"); n.onclick = () => renderHome();
    cf.append(y,n); ov.appendChild(cf);
  }
  main.appendChild(ov);
}

/* ---------- Quiz ---------- */
function startRun(sid, mode){
  const ids = qOf(sid).filter(q => mode === "wrong" ? status(q.id) === "wrong" : status(q.id) !== "right").map(q => q.id);
  run = {sid, queue: shuffle(ids), total: ids.length, missed: new Set()};
  nextQ();
}
function nextQ(){
  if (!run.queue.length) return renderDone();
  run.cur = QUESTIONS.find(x => x.id === run.queue[0]);
  run.answered = false; run.order = shuffle([0,1,2,3]);
  renderQ(); window.scrollTo({top:0});
}
function answer(pos){
  if (run.answered) return;
  run.answered = true; run.pick = pos;
  const q = run.cur, ok = run.order[pos] === q.c;
  run.queue.shift();
  if (ok) store[q.id] = "right";
  else { store[q.id] = "wrong"; run.missed.add(q.id); run.queue.splice(Math.min(run.queue.length, 3), 0, q.id); }
  save(); renderQ();
}
function toHome(){ run = null; renderHome(); window.scrollTo({top:0}); }
function renderQ(){
  closeLightbox();
  page.classList.add("quizmode");
  renderNav(); renderAside();
  const q = run.cur, letters = ["A","B","C","D"], s = sess(q.s);
  const done = run.total - new Set(run.queue).size;
  main.replaceChildren();
  const qh = $("div","qhead");
  qh.appendChild(crumbs([{label:"Altklausuren", go:toHome},{label:crumbLabel(s), go:toHome},{label:`${done} von ${run.total} Fragen`}]));
  const b = $("div","bar"); const i = $("i"); i.style.width = (done/run.total*100)+"%"; i.style.background = "var(--right-bar)"; b.appendChild(i);
  qh.appendChild(b);
  main.appendChild(qh);

  const meta = $("div","qmeta");
  meta.appendChild($("span","chip" + (q.neg ? " neg" : ""), q.neg ? "Falsche Aussage gesucht" : "Richtige Aussage gesucht"));
  if (q.origin) meta.appendChild($("span","chip", q.origin));
  if (run.missed.has(q.id) && !run.answered) meta.appendChild($("span","chip repeat","Wiederholung"));
  main.append(meta, qText(q));
  if (q.img){
    const fig = $("figure","qfig"), im = $("img");
    im.src = q.img; im.alt = "Abbildung zur Frage (" + (q.origin || q.id) + ")"; im.loading = "eager"; im.decoding = "async";
    const zb = $("button","zoom"); zb.type = "button"; zb.setAttribute("aria-label","Abbildung vergrößern");
    zb.appendChild(im); zb.onclick = () => openLightbox(q.img, im.alt, zb);
    fig.append(zb, $("figcaption",null,"Zum Vergrößern tippen")); main.appendChild(fig);
  }

  const opts = $("div","opts");
  run.order.forEach((oi, pos) => {
    const bt = $("button","opt"); bt.type = "button";
    bt.append($("span","let",letters[pos]), $("span","txt",q.o[oi]));
    if (run.answered){
      bt.disabled = true;
      if (oi === q.c) bt.classList.add("is-right");
      else if (pos === run.pick) bt.classList.add("is-wrong");
      else bt.classList.add("dim");
    } else bt.onclick = () => answer(pos);
    opts.appendChild(bt);
  });
  main.appendChild(opts);

  if (run.answered){
    const ok = run.order[run.pick] === q.c;
    const fb = $("div","feedback " + (ok ? "ok" : "no"));
    fb.append($("strong",null, ok ? "Richtig" : `Falsch – richtig ist ${letters[run.order.indexOf(q.c)]}`), $("p",null,q.e));
    if (q.src) fb.appendChild($("span","src",q.src));
    if (Array.isArray(q.also) && q.also.length) fb.appendChild($("span","src","Auch in: " + q.also.join(", ")));
    if (!ok) fb.appendChild($("span","src","Diese Frage kommt gleich noch einmal."));
    main.appendChild(fb);
    const nx = $("button","btn primary next", run.queue.length ? "Weiter" : "Auswertung"); nx.onclick = nextQ;
    main.appendChild(nx);
    setTimeout(() => nx.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest"}), 30);
  }
}
function renderDone(){
  const n = run.total, missed = run.missed.size, first = n - missed, s = sess(run.sid);
  main.replaceChildren(crumbs([{label:"Altklausuren", go:toHome},{label:crumbLabel(s), go:toHome},{label:"Auswertung"}]));
  main.append($("h1","title","Alle Fragen richtig beantwortet."), $("div","big", `${first}/${n}`),
    $("p","lead", missed ? `${first} beim ersten Versuch richtig, ${missed} erst nach Wiederholung.` : "Alles beim ersten Versuch richtig."));
  const act = $("div","actions"); const home = $("button","btn primary","Zur Übersicht"); home.onclick = toHome; act.appendChild(home);
  main.appendChild(act);
}

renderHome();
</script>
</body>
</html>
